<title>Team Quiz - Host</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#101010;
    color:#fff;
}

.game{
    width:100%;
    height:100vh;
    padding:12px;
    display:flex;
    flex-direction:column;
}

/* TOP */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.title{
    font-size:25px;
    font-weight:bold;
}

.status{
    padding:7px 14px;
    border-radius:20px;
    background:#555;
    font-size:13px;
}

.status.connected{
    background:#159447;
}

/* SCORES */

.scores{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.team{
    flex:1;
    max-width:50%;
    text-align:center;
    padding:15px;
    border-radius:16px;
    background:#202020;
    border:4px solid;
    min-height:120px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:
        all .4s ease,
        opacity .3s ease;
}

.team1{
    border-color:#3498db;
    color:#3498db;
}

.team2{
    border-color:#e74c3c;
    color:#e74c3c;
}

.team.buzzer-winner{
    flex:0 0 70%;
    max-width:70%;
    min-height:170px;
    animation:winnerGlow .7s infinite;
}

.team.hidden-team{
    flex:0 0 0%;
    max-width:0;
    width:0;
    padding:0;
    margin:0;
    opacity:0;
    transform:scale(0);
    overflow:hidden;
    border-width:0;
}

@keyframes winnerGlow{

    0%,100%{
        box-shadow:0 0 5px transparent;
    }

    50%{
        box-shadow:
            0 0 15px currentColor,
            0 0 35px currentColor,
            0 0 60px currentColor;
        border-color:#fff;
    }

}

.team-name{
    font-size:30px;
    font-weight:bold;
}

.team-score{
    font-size:65px;
    font-weight:bold;
    line-height:1;
    margin:5px 0;
}

.buzz{
    min-height:25px;
    font-size:18px;
    font-weight:bold;
}

/* QUESTION */

.question-box{
    flex:1;
    width:100%;
    max-width:950px;
    margin:auto;

    background:#fff;
    color:#111;

    border-radius:15px;
    padding:20px;

    text-align:center;

    display:flex;
    flex-direction:column;
    justify-content:center;

    min-height:0;
}

.progress{
    color:#666;
    font-size:15px;
    margin-bottom:12px;
}

.question{
    font-size:28px;
    font-weight:bold;
    margin-bottom:22px;
}

.choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.choice{
    width:100%;
    padding:16px;

    border:0;
    border-radius:10px;

    background:#e5e5e5;

    font-size:18px;

    cursor:pointer;

    text-align:left;

    transition:.2s;
}

.choice:hover:not(:disabled){
    background:#d5d5d5;
    transform:scale(1.01);
}

.choice.revealed{
    background:#9edcff!important;
}

.choice.correct{
    background:#20a35a!important;
    color:#fff!important;
}

.choice.wrong{
    background:#e74c3c!important;
    color:#fff!important;
}

.choice:disabled{
    cursor:not-allowed;
}

.message{
    min-height:30px;
    margin-top:15px;
    font-size:19px;
    font-weight:bold;
}

/* TIMER */

#timer{
    display:none;

    margin:8px auto;

    padding:8px 18px;

    width:max-content;
    min-width:90px;

    border:3px solid #f1c40f;
    border-radius:12px;

    font-size:30px;
    font-weight:bold;

    background:#151515;
    color:#f1c40f;
}

/* BOTTOM */

.bottom{
    height:55px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:8px;

    flex-wrap:wrap;
}

.control-btn{
    border:0;
    border-radius:8px;

    padding:9px 18px;

    font-size:14px;

    cursor:pointer;
}

.connect{
    background:#3498db;
    color:#fff;
}

.second-screen{
    background:#8e44ad;
    color:#fff;
}

.controller-btn{
    background:#f39c12;
    color:#fff;

    text-decoration:none;

    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.upload-btn{
    background:#16a085;
    color:#fff;
    cursor:pointer;
}

.generator-btn{
    background:#16a085;
    color:#fff;

    text-decoration:none;

    display:inline-flex;
    align-items:center;
    justify-content:center;
}

/* ROOM */

.room-area{
    position:relative;

    display:flex;
    flex-direction:column;
    align-items:center;
}

#roomInput{
    outline:none;
    transition:.2s;
}

#roomInput.room-error{
    border:2px solid #e74c3c !important;
    background:#fff5f5 !important;
    color:#c0392b !important;
}

#roomInput.room-ok{
    border:2px solid #27ae60 !important;
    background:#f4fff8 !important;
    color:#111 !important;
}

#roomInput.room-checking{
    border:2px solid #f1c40f !important;
    background:#fffdf0 !important;
    color:#111 !important;
}

.room-warning{
    display:none;

    position:absolute;

    bottom:100%;
    left:50%;

    transform:translateX(-50%);

    margin-bottom:6px;

    white-space:nowrap;

    color:#fff;

    background:#c0392b;

    border:1px solid #ff7675;

    border-radius:6px;

    padding:5px 10px;

    font-size:12px;

    font-weight:bold;

    z-index:100;

    box-shadow:0 3px 10px rgba(0,0,0,.4);
}

.room-warning.show{
    display:block;
}

/* MOBILE */

@media(max-width:600px){

    .title{

    }

    }

    .choices{
        grid-template-columns:1fr;
    }

    .team-score{
        font-size:50px;
    }

    .bottom{
        height:auto;
    }

}

</style>

/* =========================================================
   AUDIO
========================================================= */

const bgm = new Audio("audio/bgm.mp3");

const bgm1Variants = [
    new Audio("audio/bgm1-1.mp3"),
    new Audio("audio/bgm1-2.mp3"),
    new Audio("audio/bgm1-3.mp3"),
    new Audio("audio/bgm1-4.mp3"),
    new Audio("audio/bgm1-5.mp3"),
    new Audio("audio/bgm1-6.mp3"),
    new Audio("audio/bgm1-7.mp3"),
    new Audio("audio/bgm1-8.mp3")
];

const bgm2 = new Audio("audio/bgm2.mp3");

const correctSound =
    new Audio("audio/Fact.mp3");

const wrongSound =
    new Audio("audio/mali.mp3");

const timerSound =
    new Audio("audio/timer.mp3");

bgm.loop = true;
bgm.volume = .5;

bgm2.volume = .5;
timerSound.volume = .5;

bgm1Variants.forEach(a=>{
    a.loop = false;
    a.volume = .5;
});

let musicStarted = false;
let currentBgm1 = null;
let bgm1FadeInterval = null;
let bgm1Fading = false;
let autoNextAfterBgm1 = false;

async function playAudio(a){

    try{

        await a.play();

        return true;

    }catch(e){

        console.log(
            "Audio blocked:",
            e
        );

        return false;
    }

}

function stopAudio(a){

    a.pause();
    a.currentTime = 0;

}

async function startInitialBGM(){

    if(musicStarted)return;

    musicStarted = true;

    await playAudio(bgm);

}

document.addEventListener(
    "click",
    startInitialBGM,
    {once:true}
);

function clearBgm1Fade(){

    if(bgm1FadeInterval){

        clearInterval(
            bgm1FadeInterval
        );

        bgm1FadeInterval = null;
    }

    bgm1Fading = false;

}

function resetBgm1(a){

    a.onended = null;
    a.pause();
    a.currentTime = 0;
    a.volume = .5;

}

function fadeOutBgm1(callback){

    const a = currentBgm1;

    if(!a){

        if(callback)callback();

        return;
    }

    if(bgm1Fading)return;

    bgm1Fading = true;

    const start = a.volume;
    const steps = 30;
    let n = 0;

    bgm1FadeInterval =
        setInterval(()=>{

            n++;

            a.volume =
                Math.max(
                    0,
                    start *
                    (1-n/steps)
                );

            if(n>=steps){

                clearInterval(
                    bgm1FadeInterval
                );

                bgm1FadeInterval = null;

                a.pause();
                a.currentTime = 0;
                a.volume = .5;
                a.onended = null;

                if(currentBgm1===a){

                    currentBgm1 = null;

                }

                bgm1Fading = false;

                if(callback){
                    callback();
                }

            }

        },50);

}

async function startQuizBGM(){

    stopAudio(bgm);
    stopAudio(bgm2);

    if(currentBgm1){

        await new Promise(
            r=>fadeOutBgm1(r)
        );

    }

    bgm1Variants.forEach(
        resetBgm1
    );

    await playAudio(bgm2);

}

async function playCorrectBGM(){

    stopAudio(bgm2);
    stopAudio(bgm);

    bgm1Variants.forEach(
        resetBgm1
    );

    clearBgm1Fade();

    const a =
        bgm1Variants[
            Math.floor(
                Math.random() *
                bgm1Variants.length
            )
        ];

    currentBgm1 = a;

    autoNextAfterBgm1 = true;

    a.onended = ()=>{

        if(currentBgm1!==a)return;

        a.currentTime = 0;

        a.play().catch(()=>{});

        fadeOutBgm1(()=>{

            if(autoNextAfterBgm1){

                autoNextAfterBgm1 = false;

                startNextQuestionAfterBgm1();

            }

        });

    };

    await playAudio(a);

}

async function startNextQuestionAfterBgm1(){

    stopTimers();
    stopTimerSound();
    hideTimer();

/* =========================================================
   HOST LOCK SYSTEM
========================================================= */

const HOST_ID_KEY =
    "teamQuiz_hostId";

let hostId =
    localStorage.getItem(
        HOST_ID_KEY
    );

if(!hostId){

    hostId =
        "host_" +
        Date.now() +
        "_" +
        Math.random()
        .toString(36)
        .substring(2,10);

    localStorage.setItem(
        HOST_ID_KEY,
        hostId
    );

}

let hostLockRef = null;
let hostLockActive = false;


/* =========================================================
   HOST LOCK
========================================================= */

async function claimHostLock(){

    if(!roomRef){

        return {
            success:false,
            reason:"NO_ROOM"
        };

    }

    hostLockRef =
        roomRef.child(
            "hostLock"
        );

    try{

        const result =
            await hostLockRef.transaction(
                current=>{

                    if(current === null){

                        return {

                            hostId,

                            connectedAt:
                                firebase.database
                                .ServerValue
                                .TIMESTAMP

                        };

                    }

                    if(
                        current &&
                        current.hostId === hostId
                    ){

                        return current;

                    }

                    return;

                },
                undefined,
                false
            );

        if(!result.committed){

            return {
                success:false,
                reason:"LOCKED"
            };

        }

        const lock =
            result.snapshot.val();

        if(
            !lock ||
            lock.hostId !== hostId
        ){

            return {
                success:false,
                reason:"LOCKED"
            };

        }

        hostLockActive = true;

        await hostLockRef
            .onDisconnect()
            .remove();

        await roomRef.update({

            roomNumber:
                roomNumber,

            updatedAt:
                firebase.database
                .ServerValue
                .TIMESTAMP

        });

        return {
            success:true
        };

    }catch(error){

        console.error(
            "Host lock error:",
            error
        );

        return {
            success:false,
            reason:"ERROR",
            error
        };

    }

}


/* =========================================================
   RELEASE HOST LOCK
========================================================= */

async function releaseHostLock(){

    if(
        !hostLockRef ||
        !hostLockActive
    ){

        return;
    }

    try{

        await hostLockRef.transaction(
            current=>{

                if(
                    current &&
                    current.hostId === hostId
                ){

                    return null;

                }

                return;

            }
        );

    }catch(error){

        console.error(
            "Release host lock error:",
            error
        );

    }

    hostLockActive = false;

}


/* =========================================================
   ROOM WARNING
========================================================= */

function showHostAlreadyConnected(){

    roomWarning.innerText =
        "⚠️ ROOM ALREADY IN USE";

    roomWarning.classList.add(
        "show"
    );

    roomInput.classList.add(

    connectionStatus.classList.remove(

}

function showRoomChecking(){

    roomWarning.classList.remove(
        "show"
    );

    roomInput.classList.remove(
        "room-error",
        "room-ok"
    );

    roomInput.classList.add(
        "room-checking"
    );

    connectionStatus.innerText =
        "Firebase: Checking Room...";

    connectionStatus.classList.remove(

    );

}

function hideRoomWarning(){

    roomWarning.classList.remove(
        "show"
    );

    roomInput.classList.remove(
        "room-error",
        "room-checking"
    );

    roomInput.classList.add(
        "room-ok"
    );

}


/* =========================================================
   STORAGE
========================================================= */

const STORAGE_KEYS = {

    ROOM:
        "teamQuiz_savedRoom",

    QUESTIONS:
        "teamQuiz_savedQuestions"

};


/* =========================================================
   FIREBASE CONNECTION
========================================================= */

const firebaseConnectionRef =
    db.ref(".info/connected");

firebaseConnectionRef.on(
    "value",
    snap=>{

        const connected =
            snap.val() === true;

        if(!connected){

            firebaseConnected = false;

            connectionStatus.innerText =
                "Firebase: Offline";

            connectionStatus.classList.remove(
                "connected"
            );

            return;

        }

        console.log(
            "Firebase: ONLINE"
        );

        if(
            hostLockActive &&
            roomRef &&
            roomNumber
        ){

            firebaseConnected = true;

            connectionStatus.innerText =
                "Firebase: Connected • Room " +
                roomNumber;

            connectionStatus.classList.add(
                "connected"
            );

        }

    }
);


/* =========================================================
   STOP ROOM LISTENERS
========================================================= */

function stopRoomListeners(){

    if(!roomRef)return;

    if(roomAvailabilityListener){

        roomRef.off(
            "value",
            roomAvailabilityListener
        );

        roomAvailabilityListener = null;

    }

    roomRef
        .child("buzzer")
        .off();

    roomRef
        .child("answer")
        .off();

    roomRef
        .child("remoteButton")
        .off();

    remoteListenerStarted = false;

}


/* =========================================================
   CONNECT ROOM
========================================================= */

connectBtn.onclick = async ()=>{

    await startInitialBGM();

    const value =
        roomInput.value.trim();

    if(!value){

        alert(
            "Enter a room number first."
        );

        return;

    }

    if(
        hostLockActive &&
        roomNumber !== value
    ){

        await releaseHostLock();

        stopRoomListeners();

    }

    roomNumber = value;

    saveRoomNumber();

    roomRef =
        db.ref(
            "rooms/" +
            roomNumber
        );

    showRoomChecking();

    try{

        const lockResult =
            await claimHostLock();

        if(
            !lockResult.success
        ){

            firebaseConnected = false;

            hostLockActive = false;

            showHostAlreadyConnected();

            alert(
                "ROOM " +
                roomNumber +
                " IS ALREADY CONNECTED TO ANOTHER HOST."
            );

            return;

        }

        firebaseConnected = true;

        hideRoomWarning();

        connectionStatus.innerText =
            "Firebase: Connected • Room " +
            roomNumber;

        connectionStatus.classList.add(
            "connected"
        );

        connectBtn.innerText =
            "✓ ROOM CONNECTED";

        stopRoomListeners();

        listenFirebase();

        remoteListenerStarted = false;

        lastRemoteTimestamp = 0;

        listenRemoteButtons();

        roomRef
            .child("remoteButton")
            .once("value")
            .then(snap=>{

                const d =
                    snap.val();

                if(
                    d &&
                    d.timestamp
                ){

                    lastRemoteTimestamp =
                        Number(
                            d.timestamp
                        );

                }

            })
            .catch(console.error);

        await roomRef.update({

            roomNumber:
                roomNumber,

            updatedAt:
                firebase.database
                .ServerValue
                .TIMESTAMP

        });

        publishQuizState(
            "WAITING",
            null
        );

        if(roomAvailabilityListener){

            roomRef.off(
                "value",
                roomAvailabilityListener
            );

        }

        roomAvailabilityListener =
            snap=>{

                const data =
                    snap.val();

                if(!data){

                    firebaseConnected = false;

                    showHostAlreadyConnected();

                    connectionStatus.innerText =
                        "Firebase: Room Removed";

                    connectionStatus.classList.remove(
                        "connected"
                    );

                    return;
                }

                const lock =
                    data.hostLock;

                if(
                    lock &&
                    lock.hostId === hostId
                ){

                    firebaseConnected = true;

                    hideRoomWarning();

                    connectionStatus.innerText =
                        "Firebase: Connected • Room " +
                        roomNumber;

                    connectionStatus.classList.add(
                        "connected"
                    );

                    return;
                }

                if(lock){

                    firebaseConnected = false;

                    showHostAlreadyConnected();

                    return;
                }

                firebaseConnected = false;

                hideRoomWarning();

                connectionStatus.innerText =
                    "Firebase: Room Available • " +
                    roomNumber;

                connectionStatus.classList.remove(
                    "connected"
                );

            };

        roomRef.on(
            "value",
            roomAvailabilityListener
        );

        console.log(
            "ROOM CONNECTED:",
            roomNumber
        );

        console.log(
            "HOST ID:",
            hostId
        );

    }catch(error){

        console.error(
            "CONNECT ROOM ERROR:",
            error
        );

        firebaseConnected = false;

        hostLockActive = false;

        showHostAlreadyConnected();

        connectionStatus.innerText =
            "Firebase: Connection Error";

        connectionStatus.classList.remove(
            "connected"
        );

        alert(
            "Firebase connection error:\n\n" +
            error.message
        );

    }

};


/* =========================================================
   FIREBASE LISTENERS
========================================================= */

function listenFirebase(){

    if(!roomRef)return;

    roomRef
        .child("buzzer")
        .off("value");

    roomRef
        .child("answer")
        .off("value");

    roomRef
        .child("buzzer")
        .on(
            "value",
            snap=>{

                const d =
                    snap.val();

                if(
                    !d ||
                    Number(d.round)!==
                        currentQuestion+1 ||
                    answered
                ){

                    return;

                }

                teamBuzz(
                    d.player === "player1"
                    ? 1
                    : 2
                );

            }
        );

    roomRef
        .child("answer")
        .on(
            "value",
            snap=>{

                const d =
                    snap.val();

                if(
                    !d ||
                    Number(d.round)!==
                        currentQuestion+1 ||
                    answered
                ){

                    return;

                }

                const idx = {

                    A:0,
                    B:1,
                    C:2,
                    D:3

                }[
                    String(
                        d.answer || ""
                    ).toUpperCase()
                ];

                if(idx === undefined)return;

                const buttons =
                    document.querySelectorAll(
                        ".choice"
                    );

                const button =
                    buttons[idx];

                if(!button)return;

                const p =
                    String(
                        d.player || ""
                    ).toLowerCase();

                if(
                    p !== "player1" &&
                    p !== "player2"
                ){

                    return;
                }

                if(
                    !button.classList.contains(
                        "revealed"
                    )
                ){

                    button.classList.add(
                        "revealed"
                    );

                    revealedChoices++;

                }

                if(button.disabled)return;

                selectAnswer(
                    idx,
                    button,
                    p
                );

            }
        );

}


/* =========================================================
   REMOTE BUTTON LISTENER
========================================================= */

function listenRemoteButtons(){

    if(
        !roomRef ||
        remoteListenerStarted
    ){

        return;
    }

    remoteListenerStarted = true;

    roomRef
        .child("remoteButton")
        .on(
            "value",
            snap=>{

                const d =
                    snap.val();

                if(!d)return;

                const timestamp =
                    Number(
                        d.timestamp || 0
                    );

                if(
                    timestamp <=
                    lastRemoteTimestamp
                ){

                    return;
                }

                lastRemoteTimestamp =
                    timestamp;

                if(
                    d.round &&
                    Number(d.round)!==
                        currentQuestion+1
                ){

                    return;
                }

                const command =
                    String(
                        d.command || ""
                    ).toUpperCase();

                if(command==="TEAM1"){

                    if(
                        lockedTeam===1 ||
                        currentTeam===3 ||
                        currentTeam!==0
                    ){

                        return;
                    }

                    teamBuzz(1);

                    return;
                }

                if(command==="TEAM2"){

                    if(
                        lockedTeam===2 ||
                        currentTeam===4 ||
                        currentTeam!==0
                    ){

                        return;
                    }

                    teamBuzz(2);

                    return;
                }

                const idx = {

                    A:0,
                    B:1,
                    C:2,
                    D:3

                }[command];

                if(idx===undefined)return;

                const player =
                    String(
                        d.player || ""
                    ).toLowerCase();

                if(
                    player!=="player1" &&
                    player!=="player2"
                ){

                    return;
                }

                if(
                    player==="player1" &&
                    (
                        lockedTeam===1 ||
                        (
                            currentTeam!==1 &&
                            currentTeam!==4
                        )
                    )
                ){

                    return;
                }

                if(
                    player==="player2" &&
                    (
                        lockedTeam===2 ||
                        (
                            currentTeam!==2 &&
                            currentTeam!==3
                        )
                    )
                ){

                    return;
                }

                const buttons =
                    document.querySelectorAll(
                        ".choice"
                    );

                const button =
                    buttons[idx];

                if(!button)return;

                if(
                    !button.classList.contains(
                        "revealed"
                    )
                ){

                    button.classList.add(
                        "revealed"
                    );

                    revealedChoices++;

                }

                if(button.disabled)return;

                selectAnswer(
                    idx,
                    button,
                    player
                );

            }
        );

}


/* =========================================================
   PUBLISH QUIZ STATE
========================================================= */

function publishQuizState(
    phase,
    allowedPlayer
){

    if(
        !firebaseConnected ||
        !roomRef
    ){

        return;
    }

    roomRef
        .child("state")
        .set({

            phase,

            round:
                currentQuestion+1,

            attempt:
                Math.max(
                    1,
                    answerAttempts
                ),

            allowedPlayer:
                allowedPlayer || null,

            player:
                (
                    currentTeam===1 ||
                    currentTeam===4
                )
                ?
                "player1"
                :
                (
                    currentTeam===2 ||
                    currentTeam===3
                )
                ?
                "player2"
                :
                null,

            correct:
                answerResult==="correct",

            revealedChoices,

            timerSeconds,

            timerMode,

            at:
                firebase.database
                .ServerValue
                .TIMESTAMP

        })
        .catch(console.error);

}


function publishRoundStart(){

    if(
        !firebaseConnected ||
        !roomRef
    ){

        return;
    }

    roomRef.update({

        round:
            currentQuestion+1,

        buzzer:null,

        answer:null,

        state:{

            phase:"WAITING",

            round:
                currentQuestion+1,

            attempt:1,

            allowedPlayer:null,

            at:
                firebase.database
                .ServerValue
                .TIMESTAMP

        }

    }).catch(console.error);

}

/* =========================================================
   REVEAL CHOICE
========================================================= */

function revealNextChoice(){

    /*
     * HINDI PUWEDE MAG-REVEAL
     * KAPAG MAY BUZZ O ANSWER TIMER
     */
    if(
        answered ||
        timerMode==="buzz" ||
        timerMode==="answer" ||
        currentTeam!==0
    ){

        return;
    }

    if(revealedChoices<4){

        revealedChoices++;

        const buttons =
            document.querySelectorAll(
                ".choice"
            );

        const b =
            buttons[
                revealedChoices-1
            ];

        if(b){

            b.classList.add(
                "revealed"
            );

        }

        publishQuizState(
            "WAITING",
            null
        );

        sendScreenState();

        /*
         * Kapag 4 choices na,
         * automatic start ng BUZZ countdown.
         */
        if(revealedChoices===4){

            startBuzzTimer();

        }

        return;

    }

}


/* =========================================================
   ENTER KEY CONTROL
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName==="INPUT" ||
            e.target.tagName==="TEXTAREA"
        ){

            return;
        }

        if(e.key!=="Enter"){

            return;
        }

        e.preventDefault();

        /*
         * BUZZ COUNTDOWN
         * ENTER LOCKED
         */
        if(timerMode==="buzz"){

            return;
        }

        /*
         * ANSWER COUNTDOWN
         * ENTER LOCKED
         */
        if(timerMode==="answer"){

            return;
        }

        /*
         * 
         * ENTER = NEXT QUESTION
         */
        if(answered){

            if(bgm1Fading){

                return;
            }

            nextQuestionBtn.click();

            return;
        }

        /*
         * WAITING
         * ENTER = REVEAL NEXT CHOICE
         */
        if(
            currentTeam===0 &&
            revealedChoices<4
        ){

            revealNextChoice();

        }

    }
);


/* =========================================================
   BUZZER
========================================================= */

function teamBuzz(team){

    /*
     * IMPORTANT:
     * Kapag may timer na tumatakbo,
     * Enter ay hindi makakaapekto rito.
     */

    if(
        answered ||
        revealedChoices<1
    ){

        return;
    }

    if(currentTeam===0){

        currentTeam=team;

        /*
         * STOP BUZZ COUNTDOWN
         * Hindi na ito babalik sa 10.
         */
        stopBuzzTimer();

        publishQuizState(
            "BUZZ",
            team===1
            ? "player1"
            : "player2"
        );

        if(team===1){

            team1Box.classList.add(
                "buzzer-winner"
            );

            team2Box.classList.add(
                "hidden-team"
            );

            buzz1.innerText =
                "🔵 TEAM 1 BUZZED!";

            buzz2.innerText="";

        }else{

            team2Box.classList.add(
                "buzzer-winner"
            );

            team1Box.classList.add(
                "hidden-team"
            );

            buzz2.innerText =
                "🔴 TEAM 2 BUZZED!";

            buzz1.innerText="";

        }

        startAnswerAfterBuzz();

        sendScreenState();

        return;
    }


    /*
     * TEAM 2 STEAL
     */
    if(
        currentTeam===3 &&
        team===2
    ){

        currentTeam=2;

        team1Box.classList.add(
            "hidden-team"
        );

        team2Box.classList.remove(
            "hidden-team"
        );

        team2Box.classList.add(
            "buzzer-winner"
        );

        buzz2.innerText =
            "🔴 TEAM 2 STEAL!";

        publishQuizState(
            "STEAL",
            "player2"
        );

        startAnswerAfterBuzz();

        sendScreenState();

        return;
    }


    /*
     * TEAM 1 STEAL
     */
    if(
        currentTeam===4 &&
        team===1
    ){

        currentTeam=1;

        team2Box.classList.add(
            "hidden-team"
        );

        team1Box.classList.remove(
            "hidden-team"
        );

        team1Box.classList.add(
            "buzzer-winner"
        );

        buzz1.innerText =
            "🔵 TEAM 1 STEAL!";

        publishQuizState(
            "STEAL",
            "player1"
        );

        startAnswerAfterBuzz();

        sendScreenState();

    }

}

function startAnswerAfterBuzz(){

        :

/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    if(
        currentQuestion >=
        questions.length
    ){

        finishQuiz();

        return;
    }

    currentTeam=0;
    answered=false;
    answerAttempts=0;
    revealedChoices=0;
    lockedTeam=0;
    selectedAnswerIndex=-1;
    answerResult="";

    autoNextAfterBgm1=false;
    lastRemoteTimestamp=0;

    if(currentBgm1){

        currentBgm1.onended=null;

    }

    team1Box.classList.remove(
        "buzzer-winner",
        "hidden-team"
    );

    team2Box.classList.remove(
        "buzzer-winner",
        "hidden-team"
    );

    buzz1.innerText="Ready";
    buzz2.innerText="Ready";

    progressElement.innerText =
        `Question ${
            currentQuestion+1
        } / ${
            questions.length
        }`;

    const q =
        questions[currentQuestion];

    questionElement.innerText =
        q.question;

    choicesElement.innerHTML="";

    ["A","B","C","D"].forEach(
        (letter,index)=>{

            const b =
                document.createElement(
                    "button"
                );

            b.className="choice";

            b.innerText =
                letter +
                ". " +
                q.choices[index];

            b.disabled=false;

            b.onclick=()=>{

                /*
                 * MANUAL HOST CLICK
                 */
                if(
                    timerMode==="buzz"
                ){

                    return;
                }

                if(
                    !b.classList.contains(
                        "revealed"
                    )
                ){

                    b.classList.add(
                        "revealed"
                    );

                    revealedChoices++;

                    publishQuizState(
                        currentTeam===0
                        ?
                        "WAITING"
                        :
                        "BUZZ",

                        currentTeam===1 ||
                        currentTeam===4
                        ?
                        "player1"
                        :
                        currentTeam===2 ||
                        currentTeam===3
                        ?
                        "player2"
                        :
                        null
                    );

                    sendScreenState();

                }

                if(currentTeam===0){

                    /*
                     * Kapag 4 na,
                     * start buzz countdown.
                     */
                    if(
                        revealedChoices>=4
                    ){

                        startBuzzTimer();

                    }

                    return;
                }

                selectAnswer(
                    index,
                    b
                );

            };

            choicesElement.appendChild(b);

        }
    );

    stopTimers();
    hideTimer();

    messageElement.innerText="";

    publishRoundStart();

    sendScreenState();

}


/* =========================================================
   TIMERS
========================================================= */

function stopTimers(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer=null;

    }

    if(answerTimer){

        clearInterval(
            answerTimer
        );

        answerTimer=null;

    }

}


function stopBuzzTimer(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer=null;

    }

}


function stopTimerSound(){

    timerSound.pause();

    timerSound.currentTime=0;

    timerSound.onended=null;

}


function showTimer(
    seconds,
    mode
){

    timerMode=mode;

    timerSeconds=seconds;

    timerElement.style.display =
        "block";

    timerElement.innerText =
        seconds;

    timerElement.style.borderColor =
        mode==="buzz"
        ?
        "#f1c40f"
        :
        "#e67e22";

    timerElement.style.color =
        mode==="buzz"
        ?
        "#f1c40f"
        :
        "#e67e22";

    publishQuizState(

        mode==="buzz"
        ?
        "READY"
        :
        "BUZZ",

        currentTeam===1 ||
        currentTeam===4
        ?
        "player1"
        :
        currentTeam===2 ||
        currentTeam===3
        ?
        "player2"
        :
        null

    );

}


function hideTimer(){

    timerElement.style.display =
        "none";

    timerSeconds=0;

    timerMode="";

}


/* =========================================================
   BUZZ COUNTDOWN
========================================================= */

function startBuzzTimer(){

    stopTimers();

    /*
     * START EXACTLY AT 10
     */
    showTimer(
        10,
        "buzz"
    );

    publishQuizState(
        "READY",
        null
    );

    sendScreenState();

    buzzTimer =
        setInterval(()=>{

            /*
             * MAY NAG-BUZZ NA
             * STOP. HUWAG I-RESET.
             */
            if(currentTeam!==0){

                stopBuzzTimer();

                return;
            }

            timerSeconds--;

            timerElement.innerText =
                timerSeconds;

            sendScreenState();

            if(
                timerSeconds<=0
            ){

                stopBuzzTimer();

                hideTimer();

                publishQuizState(
                    "WAITING",
                    null
                );

                sendScreenState();

                /*
                 * WALANG NAG-BUZZ
                 */
                setTimeout(()=>{

                    if(
                        !answered &&
                        currentTeam===0
                    ){

                        nextQuestion();

                    }

                },500);

            }

        },1000);

}


/* =========================================================
   ANSWER COUNTDOWN
========================================================= */

function startAnswerTimer(){

    stopTimers();

    showTimer(
        10,
        "answer"
    );

    timerSound.currentTime=0;

    timerSound
        .play()
        .catch(()=>{});

    answerTimer =
        setInterval(()=>{

            timerSeconds--;

            timerElement.innerText =
                timerSeconds;

            sendScreenState();

            if(
                timerSeconds<=0
            ){

                clearInterval(
                    answerTimer
                );

                answerTimer=null;

                handleAnswerTimeout();

            }

        },1000);

}


/* =========================================================
   ANSWER TIMEOUT
========================================================= */

function handleAnswerTimeout(){

    if(answered)return;

    stopTimers();
    stopTimerSound();
    hideTimer();

    document
        .querySelectorAll(".choice")
        .forEach(b=>{

            b.disabled=true;

        });

    answerAttempts++;

    wrongSound.currentTime=0;

    wrongSound
        .play()
        .catch(()=>{});

    if(answerAttempts>=2){

        revealCorrectAnswer();

        return;
    }

    prepareNextAttempt();

}


/* =========================================================
   REVEAL CORRECT
========================================================= */

function revealCorrectAnswer(){

    const q =
        questions[currentQuestion];

    const buttons =
        document.querySelectorAll(
            ".choice"
        );

    buttons.forEach(
        (b,i)=>{

            b.disabled=true;

            if(
                i===q.answer
            ){

                b.classList.add(
                    "correct"
                );

            }

        }
    );

    selectedAnswerIndex =
        q.answer;

    answerResult="correct";

    answered=true;

    stopTimers();
    stopTimerSound();
    hideTimer();

    messageElement.innerText =
        "✅ END ROUND";

    publishQuizState(
        "FINISHED",
        null
    );

    sendScreenState();

}


/* =========================================================
   STEAL
========================================================= */

function prepareNextAttempt(){

    if(answerAttempts>=2){

        revealCorrectAnswer();

        return;

    }

    if(
        currentTeam===1 ||
        currentTeam===4
    ){

        lockedTeam=1;

        currentTeam=3;

        team1Box.classList.add(
            "hidden-team"
        );

        team2Box.classList.remove(
            "hidden-team"
        );

        team2Box.classList.add(
            "buzzer-winner"
        );

        buzz1.innerText =
            "❌ WRONG";

        buzz2.innerText =
            "🔴 STEAL";

        publishQuizState(
            "STEAL",
            "player2"
        );

    }else{

        lockedTeam=2;

        currentTeam=4;

        team2Box.classList.add(
            "hidden-team"
        );

        team1Box.classList.remove(
            "hidden-team"
        );

        team1Box.classList.add(
            "buzzer-winner"
        );

        buzz2.innerText =
            "❌ WRONG";

        buzz1.innerText =
            "🔵 STEAL";

        publishQuizState(
            "STEAL",
            "player1"
        );

    }

    startAnswerTimer();

    sendScreenState();

}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(
    index,
    button,
    player=null
){

    if(
        answered ||
        currentTeam===0
    ){

        return;
    }

    if(
        !button.classList.contains(
            "revealed"
        )
    ){

        button.classList.add(
            "revealed"
        );

        revealedChoices++;

        publishQuizState(
            "BUZZ",

            currentTeam===1 ||
            currentTeam===4
            ?
            "player1"
            :
            "player2"
        );

        sendScreenState();

    }

    let answeringTeam=0;

    if(player==="player1"){

        answeringTeam=1;

    }
    else if(player==="player2"){

        answeringTeam=2;

    }
    else{

        answeringTeam =
            (
                currentTeam===1 ||
                currentTeam===4
            )
            ?
            1
            :
            2;

    }

    if(
        lockedTeam===
        answeringTeam
    ){

        return;
    }

    if(
        answeringTeam===1 &&
        currentTeam!==1 &&
        currentTeam!==4
    ){

        return;
    }

    if(
        answeringTeam===2 &&
        currentTeam!==2 &&
        currentTeam!==3
    ){

        return;
    }

    const q =
        questions[currentQuestion];

    const buttons =
        document.querySelectorAll(
            ".choice"
        );

    selectedAnswerIndex=index;

    /*
     * CORRECT
     */

    if(index===q.answer){

        answered=true;

        answerResult="correct";

        stopTimers();
        stopTimerSound();
        hideTimer();

        button.classList.remove(
            "revealed",
            "wrong"
        );

        button.classList.add(
            "correct"
        );

        buttons.forEach(
            b=>b.disabled=true
        );

        correctSound.currentTime=0;

        correctSound
            .play()
            .catch(()=>{});

        publishQuizState(
            "FINISHED",
            null
        );

        if(answeringTeam===1){

            scoreTeam1++;

            score1Element.innerText =
                scoreTeam1;

        }else{

            scoreTeam2++;

            score2Element.innerText =
                scoreTeam2;

        }

        messageElement.innerText =
            "Press Enter for next question";

        sendScreenState();

        playCorrectBGM();

        return;
    }

    /*
     * WRONG
     */

    answerResult="wrong";

    button.classList.add(
        "wrong"
    );

    button.disabled=true;

    wrongSound.currentTime=0;

    wrongSound
        .play()
        .catch(()=>{});

    stopTimers();
    stopTimerSound();
    hideTimer();

    answerAttempts++;

    lockedTeam=answeringTeam;

    if(answerAttempts>=2){

        revealCorrectAnswer();

        return;
    }

    prepareNextAttempt();

}

            e.target.tagName==="INPUT" ||
            e.target.tagName==="TEXTAREA"
        ){

            return;
        }

        /*
         * SPACEBAR WALANG NEXT FUNCTION
         */
        if(e.code==="Space"){

            return;
        }

        if(
            answered ||
            currentTeam===0
        ){

            return;
        }

        /*
         * HUWAG TUMANGGAP NG Z X C V
         * HABANG BUZZ COUNTDOWN
         */
        if(
            timerMode==="buzz" ||
            timerMode==="answer"
        ){

            return;
        }

        const map={

            z:0,
            x:1,
            c:2,
            v:3

        };

        const key =
            e.key.toLowerCase();

        if(!(key in map))return;

        const index =
            map[key];

        const b =
            document
            .querySelectorAll(
                ".choice"
            )[index];

        if(!b)return;

        if(b.disabled)return;

        e.preventDefault();

        if(
            !b.classList.contains(
                "revealed"
            )
        ){

            b.classList.add(
                "revealed"
            );

            revealedChoices++;

            publishQuizState(
                "BUZZ",

                currentTeam===1 ||
                currentTeam===4
                ?
                "player1"
                :
                "player2"
            );

            sendScreenState();

        }

        selectAnswer(
            index,
            b
        );

    }
);


/* =========================================================
   NEXT QUESTION BUTTON
========================================================= */

nextQuestionBtn.onclick=async()=>{

    /*
     * NEXT ONLY AFTER END ROUND
     */
    if(!answered){

        return;
    }

    /*
     * HUWAG NEXT HABANG
     * NAGFADE ANG BGM
     */
    if(bgm1Fading){

        return;
    }

    autoNextAfterBgm1=false;

    stopTimers();
    stopTimerSound();
    hideTimer();

    if(currentBgm1){

        await new Promise(
            r=>fadeOutBgm1(r)
        );

    }else{

        bgm1Variants.forEach(
            resetBgm1
        );

    }

    await playAudio(
        bgm2
    );

    nextQuestion();

};


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    /*
     * EXTRA SAFETY
     */
    if(!answered){

        return;
    }

    stopTimers();
    stopTimerSound();
    hideTimer();

    if(
        currentQuestion>=
        questions.length
    ){

        return;
    }

    currentQuestion++;

    if(
        currentQuestion>=
        questions.length
    ){

        finishQuiz();

        return;
    }

    loadQuestion();

}


/* =========================================================
   FINISH
========================================================= */

function finishQuiz(){

    stopAudio(bgm);
    stopAudio(bgm2);

    bgm1Variants.forEach(
        resetBgm1
    );

    currentBgm1=null;
    autoNextAfterBgm1=false;

    clearBgm1Fade();

    stopTimers();
    stopTimerSound();
    hideTimer();

    questionElement.innerText="";
    choicesElement.innerHTML="";
    progressElement.innerText="";

    messageElement.innerText =
        "QUIZ FINISHED";

    team1Box.style.display =
        "none";

    team2Box.style.display =
        "none";

    connectBtn.style.display =
        "none";

    if(
        firebaseConnected &&
        roomRef
    ){

        roomRef
            .child("state")
            .set({

                phase:
                    "QUIZ_FINISHED",

                round:
                    currentQuestion+1,

                scoreTeam1,

                scoreTeam2,

                at:
                    firebase.database
                    .ServerValue
                    .TIMESTAMP

            });

    }

    sendScreenState();

}


/* =========================================================
   UPLOAD QUESTIONS
========================================================= */

const questionsFile =
    document.getElementById(
        "questionsFile"
    );


questionsFile.addEventListener(
    "change",
    async function(e){

        const file =
            e.target.files[0];

        if(!file)return;

        if(
            !file.name
            .toLowerCase()
            .endsWith(".json")
        ){

            alert(
                "Please upload a JSON questions file."
            );

            questionsFile.value="";

            return;
        }

        try{

            const text =
                await file.text();

            const data =
                JSON.parse(text);

            let loadedQuestions=[];

            if(Array.isArray(data)){

                loadedQuestions=data;

            }
            else if(
                data &&
                Array.isArray(
                    data.questions
                )
            ){

                loadedQuestions =
                    data.questions;

            }
            else{

                throw new Error(
                    "Invalid JSON format."
                );

            }

            loadedQuestions =
                loadedQuestions.filter(q=>{

                    return(

                        q &&

                        typeof q.question===
                            "string" &&

                        Array.isArray(
                            q.choices
                        ) &&

                        q.choices.length>=4 &&

                        (
                            typeof q.answer===
                                "number" ||

                            typeof q.correct===
                                "number" ||

                            typeof q.correct===
                                "string"
                        )

                    );

                });

            if(
                !loadedQuestions.length
            ){

                throw new Error(
                    "No valid questions found."
                );

            }

            questions =
                loadedQuestions.map(q=>{

                    let answer;

                    if(
                        typeof q.answer===
                            "number"
                    ){

                        answer=q.answer;

                    }
                    else if(
                        typeof q.correct===
                            "number"
                    ){

                        answer=q.correct;

                    }
                    else{

                        const letter =
                            String(
                                q.correct
                            )
                            .trim()
                            .toUpperCase();

                        answer={

                            A:0,
                            B:1,
                            C:2,
                            D:3

                        }[letter];

                    }

                    return{

                        question:
                            q.question,

                        choices:
                            q.choices.slice(0,4),

                        answer

                    };

                });

            questions =
                questions.filter(q=>{

                    return(

                        q.answer>=0 &&
                        q.answer<4 &&
                        Number.isInteger(
                            q.answer
                        )

                    );

                });

            if(!questions.length){

                throw new Error(
                    "No valid answers found."
                );

            }

            /*
             * RANDOMIZE
             */

            for(
                let i=questions.length-1;
                i>0;
                i--
            ){

                const j =
                    Math.floor(
                        Math.random()*
                        (i+1)
                    );

                [
                    questions[i],
                    questions[j]
                ]=[
                    questions[j],
                    questions[i]
                ];

            }

            currentQuestion=0;

            scoreTeam1=0;
            scoreTeam2=0;

            score1Element.innerText="0";
            score2Element.innerText="0";

            saveQuestions();

            loadQuestion();

            alert(
                `✅ ${questions.length} questions loaded successfully!`
            );

        }catch(error){

            console.error(
                "Question JSON error:",
                error
            );

            alert(
                "❌ Failed to load questions.\n\n"+
                error.message
            );

            questions=[];

            questionsFile.value="";

        }

    }
);


/* =========================================================
   SAVE ROOM
========================================================= */

function saveRoomNumber(){

    const room =
        roomInput.value.trim();

    if(!room)return;

    localStorage.setItem(
        STORAGE_KEYS.ROOM,
        room
    );

}


/* =========================================================
   LOAD SAVED ROOM
========================================================= */

function loadSavedRoom(){

    const savedRoom =
        localStorage.getItem(
            STORAGE_KEYS.ROOM
        );

    if(savedRoom){

        roomInput.value =
            savedRoom;

    }

}


/* =========================================================
   SAVE QUESTIONS
========================================================= */

function saveQuestions(){

    if(!questions.length)return;

    try{

        localStorage.setItem(
            STORAGE_KEYS.QUESTIONS,
            JSON.stringify(
                questions
            )
        );

        console.log(
            "Questions saved locally:",
            questions.length
        );

    }catch(error){

        console.error(
            "Failed to save questions:",
            error
        );

        alert(
            "Hindi ma-save ang questions sa browser. " +
            "Baka masyadong malaki ang JSON file."
        );

    }

}


/* =========================================================
   LOAD SAVED QUESTIONS
========================================================= */

function loadSavedQuestions(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEYS.QUESTIONS
            );

        if(!saved)return false;

        const parsed =
            JSON.parse(saved);

        if(
            !Array.isArray(parsed) ||
            !parsed.length
        ){

            return false;

        }

        questions=parsed;

        currentQuestion=0;

        scoreTeam1=0;
        scoreTeam2=0;

        score1Element.innerText="0";
        score2Element.innerText="0";

        loadQuestion();

        messageElement.innerText =
            `💾 ${questions.length} saved questions loaded`;

        return true;

    }catch(error){

        console.error(
            "Saved questions error:",
            error
        );

        localStorage.removeItem(
            STORAGE_KEYS.QUESTIONS
        );

        return false;

    }

}


/* =========================================================
   ROOM INPUT
========================================================= */

roomInput.addEventListener(
    "input",
    ()=>{

        roomInput.value =
            roomInput.value.replace(
                /[^0-9]/g,
                ""
            );

        roomInput.classList.remove(
            "room-error",
            "room-ok",
            "room-checking"
        );

        roomWarning.classList.remove(
            "show"
        );

        firebaseConnected=false;

        connectionStatus.innerText =
            "Firebase: Disconnected";

        connectionStatus.classList.remove(
            "connected"
        );

        connectBtn.innerText =
            "🔌 CONNECT ROOM";

        saveRoomNumber();

    }
);


/* =========================================================
   ROOM ENTER
========================================================= */

roomInput.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter"){

            e.preventDefault();

            connectBtn.click();

        }

    }
);


/* =========================================================
   PAGE EXIT
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        /*
         * Firebase onDisconnect()
         * ang bahala sa host lock.
         */

    }
);


/* =========================================================
   RESTORE SAVED ROOM
========================================================= */

loadSavedRoom();


const restored =
    loadSavedQuestions();


if(restored){

    messageElement.innerText =
        `💾 ${questions.length} saved questions`;

}else{

    questionElement.innerText =
        "UPLOAD QUESTIONS TO START";

    progressElement.innerText =
        "No questions loaded";

    choicesElement.innerHTML="";

    messageElement.innerText =
        "📂 Click UPLOAD QUESTIONS";

}


/* =========================================================
   AUTO CONNECT SAVED ROOM
========================================================= */

window.addEventListener(
    "load",
    ()=>{

        const savedRoom =
            localStorage.getItem(
                STORAGE_KEYS.ROOM
            );

        if(!savedRoom)return;

        roomInput.value =
            savedRoom;

        setTimeout(
            ()=>{

                connectBtn.click();

            },
            1000
        );

    }
);
