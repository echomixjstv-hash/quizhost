<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>Quiz - Host</title>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{
    margin:0;
    width:100%;
    min-height:100%;
    font-family:Arial,sans-serif;
    background:#101010;
    color:#fff;
}

body{
    overflow-x:hidden;
    overflow-y:auto;
}

.game{
    width:100%;
    min-height:100vh;
    min-height:100dvh;
    padding:10px;
    display:flex;
    flex-direction:column;
}

/* =========================================================
   TOP
========================================================= */

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:7px;
}

.title{
    font-size:24px;
    font-weight:bold;
}

.status{
    padding:6px 12px;
    border-radius:20px;
    background:#555;
    font-size:12px;
}

.status.connected{
    background:#159447;
}

/* =========================================================
   SCORES
========================================================= */

.scores{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-bottom:7px;
}

.team{
    flex:0 0 22%;
    max-width:22%;
    text-align:center;

    padding:8px;
    border-radius:12px;

    background:#202020;
    border:3px solid;

    min-height:78px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    transition:
        all .35s ease,
        opacity .25s ease;
}

.team1{
    border-color:#3498db;
    color:#3498db;
}

.team2{
    border-color:#e74c3c;
    color:#e74c3c;
}

.team-name{
    font-size:16px;
    font-weight:bold;
}

.team-score{
    font-size:38px;
    font-weight:bold;
    line-height:1;
    margin:3px 0;
}

.buzz{
    min-height:18px;
    font-size:11px;
    font-weight:bold;
}

.team.buzzer-winner{
    flex:0 0 35%;
    max-width:35%;
    min-height:105px;
    animation:winnerGlow .7s infinite;
}

.team.hidden-team{
    flex:0 0 0%;
    max-width:0;
    width:0;
    padding:0;
    margin:0;
    opacity:0;
    transform:scale(0);
    overflow:hidden;
    border-width:0;
}

@keyframes winnerGlow{

    0%,100%{
        box-shadow:0 0 5px transparent;
    }

    50%{
        box-shadow:
            0 0 12px currentColor,
            0 0 28px currentColor,
            0 0 45px currentColor;
        border-color:#fff;
    }

}

/* =========================================================
   QUESTION
========================================================= */

.question-box{
    flex:1;
    width:100%;
    max-width:950px;
    margin:auto;

    background:#fff;
    color:#111;

    border-radius:15px;
    padding:18px;

    text-align:center;

    display:flex;
    flex-direction:column;
    justify-content:center;

    min-height:0;
}

.progress{
    color:#666;
    font-size:14px;
    margin-bottom:8px;
}

.question{
    font-size:27px;
    font-weight:bold;
    margin-bottom:18px;
}

.choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.choice{
    width:100%;
    padding:14px;

    border:0;
    border-radius:10px;

    background:#e5e5e5;

    font-size:17px;

    cursor:pointer;

    text-align:left;

    transition:.2s;
}

.choice:hover:not(:disabled){
    background:#d5d5d5;
    transform:scale(1.01);
}

.choice.revealed{
    background:#9edcff!important;
}

.choice.correct{
    background:#20a35a!important;
    color:#fff!important;
}

.choice.wrong{
    background:#e74c3c!important;
    color:#fff!important;
}

.choice:disabled{
    cursor:not-allowed;
}

.message{
    min-height:27px;
    margin-top:10px;
    font-size:17px;
    font-weight:bold;
}

/* =========================================================
   TIMER
========================================================= */

#timer{
    display:none;

    margin:6px auto;

    padding:6px 18px;

    width:max-content;
    min-width:80px;

    border:3px solid #f1c40f;
    border-radius:12px;

    font-size:28px;
    font-weight:bold;

    background:#151515;
    color:#f1c40f;
}

/* =========================================================
   BOTTOM
========================================================= */

.bottom{
    min-height:50px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:7px;

    flex-wrap:wrap;

    position:relative;
}

.control-btn{
    border:0;
    border-radius:8px;

    padding:8px 14px;

    font-size:13px;

    cursor:pointer;
}

.connect{
    background:#3498db;
    color:#fff;
}

.second-screen{
    background:#8e44ad;
    color:#fff;
}

.controller-btn{
    background:#f39c12;
    color:#fff;

    text-decoration:none;

    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.upload-btn{
    background:#16a085;
    color:#fff;
    cursor:pointer;
}

.generator-btn{
    background:#16a085;
    color:#fff;

    text-decoration:none;

    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.start-btn{
    background:#27ae60;
    color:#fff;
    font-weight:bold;
}

.start-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
}

.next-btn{
    background:#27ae60;
    color:#fff;
    font-weight:bold;
}

/* =========================================================
   MENU
========================================================= */

.menu-wrapper{
    position:fixed;
    top:40px;
    left:10px;
    z-index:2000;
}

.menu-toggle{
    width:42px;
    height:40px;

    border:0;
    border-radius:8px;

    background:#333;
    color:#fff;

    font-size:25px;
    font-weight:bold;

    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;
}

.menu-panel{
    position:absolute;

    left:0;
    top:48px;

    width:210px;

    background:#202020;

    border:1px solid #444;
    border-radius:10px;

    padding:8px;

    display:none;

    flex-direction:column;

    gap:6px;

    z-index:500;
}

.menu-panel.show{
    display:flex;
}

.menu-panel .control-btn,
.menu-panel label{
    width:100%;
    margin:0;
    text-align:center;
}

/* =========================================================
   ROOM
========================================================= */

.room-area{
    position:relative;

    display:flex;
    flex-direction:column;
    align-items:center;
}

#roomInput{
    outline:none;
    transition:.2s;
}

#roomInput.room-error{
    border:2px solid #e74c3c!important;
    background:#fff5f5!important;
    color:#c0392b!important;
}

#roomInput.room-ok{
    border:2px solid #27ae60!important;
    background:#f4fff8!important;
    color:#111!important;
}

#roomInput.room-checking{
    border:2px solid #f1c40f!important;
    background:#fffdf0!important;
    color:#111!important;
}

.room-warning{
    display:none;

    position:absolute;

    bottom:100%;
    left:50%;

    transform:translateX(-50%);

    margin-bottom:6px;

    white-space:nowrap;

    color:#fff;

    background:#c0392b;

    border:1px solid #ff7675;

    border-radius:6px;

    padding:5px 10px;

    font-size:12px;

    font-weight:bold;

    z-index:100;
}

.room-warning.show{
    display:block;
}

/* =========================================================
   MOBILE
========================================================= */

    html,
    body{
        width:100%;
        min-height:100%;
        overflow-x:hidden;
        overflow-y:auto;

    }

    /* =========================
       TOP
    ========================= */

    .top{

    }

    .title{

    }

    .status{

    }

    /* =========================

    .scores{

    .team{

    .menu-toggle{

   START OVERLAY
========================================================= */

    position:fixed;

    inset:0;

    z-index:1000;

<body>

<div class="game">

<div class="top">

    <div class="title">
        HOST PANEL
    </div>

    <div
        id="connectionStatus"
        class="status"
    >
        : Disconnected
    </div>

</div>

<div class="scores">

    <div
        id="team1Box"
        class="team team1"
    >

        <div class="team-name">
            🔵 PLAYER 1
        </div>

        <div
            id="score1"
            class="team-score"
        >
            0
        </div>

        <div
            id="buzz1"
            class="buzz"
        >
            Ready
        </div>

    </div>

    <div
        id="team2Box"
        class="team team2"
    >

        <div class="team-name">
            🔴 PLAYER 2
        </div>

        <div
            id="score2"
            class="team-score"
        >
            0
        </div>

        <div
            id="buzz2"
            class="buzz"
        >
            Ready
        </div>

    </div>

</div>

<div class="question-box">

    <div
        id="progress"
        class="progress"
    ></div>

    <div
        id="question"
        class="question"
    ></div>

    <div id="timer">
        10
    </div>

    <div
        id="choices"
        class="choices"
    ></div>

    <div
        id="message"
        class="message"
    ></div>

</div>

<div class="bottom">

    <div class="room-area">

        <div
            id="roomWarning"
            class="room-warning"
        >
            ⚠️ ROOM ALREADY IN USE
        </div>

        <input
            id="roomInput"
            class="control-btn"
            style="
                width:110px;
                text-align:center;
                background:white;
                color:#111;
            "
            inputmode="numeric"
            placeholder="Room #"
            autocomplete="off"
        >

    </div>

    <button
        id="connectBtn"
        class="control-btn connect"
    >
        🔌 CONNECT ROOM
    </button>

    <button
        id="nextQuestionBtn"
        class="control-btn next-btn"
    >
        ▶ NEXT QUESTION
    </button>

    <button
        id="startQuizBtn"
        class="control-btn start-btn"
        disabled
    >
        ▶ START QUIZ
    </button>

    <div class="menu-wrapper">

        <button
            id="menuToggle"
            class="menu-toggle"
            title="Menu"
        >
            ☰
        </button>

        <div
            id="menuPanel"
            class="menu-panel"
        >

            <label
                for="questionsFile"
                class="control-btn upload-btn"
            >
                📂 UPLOAD QUESTIONS
            </label>

            <input
                type="file"
                id="questionsFile"
                accept=".json"
                style="display:none"
            >

            <button
                id="secondScreenBtn"
                class="control-btn second-screen"
            >
                🖥️ SECOND SCREEN
            </button>

            <a
                href="controller.html"
                class="control-btn controller-btn"
            >
                🎮 CONTROLLER
            </a>

            <a
                href="question-generation.html"
                class="control-btn generator-btn"
            >
                📝 QUESTION GENERATOR
            </a>

        </div>

    </div>

</div>

</div>

<div
    id="startOverlay"
    class="start-overlay"
>

    <div class="start-card">

        <h2>
            🎯 READY?
        </h2>

        <p id="startInfo">
            Questions are ready.
        </p>

        <button
            id="bigStartBtn"
            class="big-start"
        >
            ▶ START QUIZ
        </button>

    </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

/* =========================================================
   AUDIO
========================================================= */

const bgm =
    new Audio("audio/bgm.mp3");

const bgm1Variants = [

    new Audio("audio/bgm1-1.mp3"),
    new Audio("audio/bgm1-2.mp3"),
    new Audio("audio/bgm1-3.mp3"),
    new Audio("audio/bgm1-4.mp3"),
    new Audio("audio/bgm1-5.mp3"),
    new Audio("audio/bgm1-6.mp3"),
    new Audio("audio/bgm1-7.mp3"),
    new Audio("audio/bgm1-8.mp3")

];

const bgm2 =
    new Audio("audio/bgm2.mp3");

const correctSound =
    new Audio("audio/Fact.mp3");

const wrongSound =
    new Audio("audio/mali.mp3");

const timerSound =
    new Audio("audio/timer.mp3");

bgm.loop=true;
bgm.volume=.5;

bgm2.volume=.5;

timerSound.volume=1;

bgm1Variants.forEach(a=>{

    a.loop=false;
    a.volume=.5;

});

/* =========================================================
   SOUND CARD
========================================================= */

const soundCard = {

    "[": new Audio("audio/sound1.mp3"),

    "]": new Audio("audio/sound2.mp3"),

    "'": new Audio("audio/sound3.mp3"),

    "\\": new Audio("audio/sound4.mp3")

};

Object.values(soundCard).forEach(sound=>{

    sound.preload="auto";
    sound.volume=1;

});

function playSoundCard(key){

    const sound =
        soundCard[key];

    if(!sound)return;

    sound.pause();

    sound.currentTime=0;

    sound.play().catch(()=>{});

}

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName==="INPUT" ||
            e.target.tagName==="TEXTAREA"
        ){

            return;

        }

        if(
            e.key==="[" ||
            e.key==="]" ||
            e.key==="'" ||
            e.key==="\\"
        ){

            e.preventDefault();

            playSoundCard(e.key);

        }

    }
);

/* =========================================================
   MUSIC
========================================================= */

let musicStarted=false;
let currentBgm1=null;
let bgm1FadeInterval=null;
let bgm1Fading=false;
let autoNextAfterBgm1=false;

async function playAudio(a){

    try{

        await a.play();

        return true;

    }catch(e){

        console.log(
            "Audio blocked:",
            e
        );

        return false;

    }

}

function stopAudio(a){

    a.pause();
    a.currentTime=0;

}

async function startInitialBGM(){

    if(musicStarted)return;

    musicStarted=true;

    await playAudio(bgm);

}

document.addEventListener(
    "click",
    startInitialBGM,
    {once:true}
);

function clearBgm1Fade(){

    if(bgm1FadeInterval){

        clearInterval(
            bgm1FadeInterval
        );

        bgm1FadeInterval=null;

    }

    bgm1Fading=false;

}

function resetBgm1(a){

    a.onended=null;
    a.pause();
    a.currentTime=0;
    a.volume=.5;

}

function fadeOutBgm1(callback){

    const a=currentBgm1;

    if(!a){

        if(callback)callback();

        return;

    }

    if(bgm1Fading)return;

    bgm1Fading=true;

    const start=a.volume;

    const steps=30;

    let n=0;

    bgm1FadeInterval=setInterval(()=>{

        n++;

        a.volume =
            Math.max(
                0,
                start*(1-n/steps)
            );

        if(n>=steps){

            clearInterval(
                bgm1FadeInterval
            );

            bgm1FadeInterval=null;

            a.pause();
            a.currentTime=0;
            a.volume=.5;
            a.onended=null;

            if(currentBgm1===a){

                currentBgm1=null;

            }

            bgm1Fading=false;

            if(callback)callback();

        }

    },50);

}

async function startQuizBGM(){

    stopAudio(bgm);
    stopAudio(bgm2);

    if(currentBgm1){

        await new Promise(
            r=>fadeOutBgm1(r)
        );

    }

    bgm1Variants.forEach(
        resetBgm1
    );

    await playAudio(bgm2);

}

async function playCorrectBGM(){

    stopAudio(bgm2);
    stopAudio(bgm);

    bgm1Variants.forEach(
        resetBgm1
    );

    clearBgm1Fade();

    const a =
        bgm1Variants[
            Math.floor(
                Math.random()*
                bgm1Variants.length
            )
        ];

    currentBgm1=a;

    autoNextAfterBgm1=true;

    a.onended=()=>{

        if(currentBgm1!==a)return;

        a.currentTime=0;

        a.play().catch(()=>{});

        fadeOutBgm1(()=>{

            if(autoNextAfterBgm1){

                autoNextAfterBgm1=false;

                startNextQuestionAfterBgm1();

            }

        });

    };

    await playAudio(a);

}

    stopTimerSound();
    hideTimer();

    nextQuestion();

if(!hostId){

    hostId =

let hostLockRef=null;
let hostLockActive=false;

async function claimHostLock(){

    if(!roomRef){

        return{
            success:false,
            reason:"NO_ROOM"
        };

    }

    hostLockRef =
        roomRef.child(
            "hostLock"
        );

    try{

        const result =
            await hostLockRef.transaction(
                current=>{

                    if(current===null){

                        return{

                            hostId,

                            connectedAt:
                                firebase
                                .database
                                .ServerValue
                                .TIMESTAMP

                        };

                    }

                    if(
                        current &&
                        current.hostId===hostId
                    ){

                        return current;

                    }

                    return;

                },
                undefined,
                false
            );

        if(!result.committed){

            return{
                success:false,
                reason:"LOCKED"
            };

        }

        const lock =
            result.snapshot.val();

        if(
            !lock ||
            lock.hostId!==hostId
        ){

            return{
                success:false,
                reason:"LOCKED"
            };

        }

        hostLockActive=true;

        await hostLockRef
            .onDisconnect()
            .remove();

        await roomRef.update({

            roomNumber,

            updatedAt:
                firebase
                .database
                .ServerValue
                .TIMESTAMP

        });

        return{
            success:true
        };

    }catch(error){

        console.error(
            "Host lock error:",
            error
        );

        return{
            success:false,
            reason:"ERROR",
            error
        };

    }

}

async function releaseHostLock(){

    if(
        !hostLockRef ||
        !hostLockActive
    ){

        return;

    }

    try{

        await hostLockRef.transaction(
            current=>{

                if(
                    current &&
                    current.hostId===hostId
                ){

                    return null;

                }

                return;

            }
        );

    }catch(error){

        console.error(
            "Release host lock error:",
            error
        );

    }

    hostLockActive=false;

}

                if(!data){

                    firebaseConnected=false;

                    connectionStatus.innerText =
                        "Room Removed";

                    connectionStatus.classList.remove(

                    return;

                    hideRoomWarning();

                    connectionStatus.innerText =
                        "Connected • Room "+

        );

function listenFirebase(){

    if(!roomRef)return;

    roomRef.child("buzzer").off();
    roomRef.child("answer").off();

    roomRef.child("buzzer").on(
        "value",
        snap=>{

            const d=snap.val();

            if(
                !d ||
                Number(d.round)!==
                    currentQuestion+1 ||
                answered
            ){

                return;

            }

            teamBuzz(
                d.player==="player1"
                ?1
                :2
            );

        }
    );

    roomRef.child("answer").on(
        "value",
        snap=>{

            const d=snap.val();

            if(
                !d ||
                Number(d.round)!==
                    currentQuestion+1 ||
                answered
            ){

                return;

            }

            const idx={

                A:0,
                B:1,
                C:2,
                D:3

            }[
                String(
                    d.answer||""
                ).toUpperCase()
            ];

            if(idx===undefined)return;

            const buttons =
                document.querySelectorAll(
                    ".choice"
                );

            const button =
                buttons[idx];

            if(!button)return;

            const p =
                String(
                    d.player||""
                ).toLowerCase();

            if(
                p!=="player1" &&
                p!=="player2"
            ){

                return;

            }

            if(
                !button.classList.contains(
                    "revealed"
                )
            ){

                button.classList.add(
                    "revealed"
                );

                revealedChoices++;

            }

            if(button.disabled)return;

            selectAnswer(
                idx,
                button,
                p
            );

        }
    );

}

/* =========================================================
   REMOTE
========================================================= */

function listenRemoteButtons(){

    if(
        !roomRef ||
        remoteListenerStarted
    ){

        return;

    }

    remoteListenerStarted=true;

    roomRef.child("remoteButton").on(
        "value",
        snap=>{

            const d=snap.val();

            if(!d)return;

            const timestamp =
                Number(
                    d.timestamp||0
                );

            if(
                timestamp<=
                lastRemoteTimestamp
            ){

                return;

            }

            lastRemoteTimestamp =
                timestamp;

            if(
                d.round &&
                Number(d.round)!==
                    currentQuestion+1
            ){

                return;

            }

            const command =
                String(
                    d.command||""
                ).toUpperCase();

            if(command==="TEAM1"){

                if(
                    lockedTeam===1 ||
                    currentTeam!==0
                ){

                    return;

                }

                teamBuzz(1);

                return;

            }

            if(command==="TEAM2"){

                if(
                    lockedTeam===2 ||
                    currentTeam!==0
                ){

                    return;

                }

                teamBuzz(2);

                return;

            }

            const idx={

                A:0,
                B:1,
                C:2,
                D:3

            }[command];

            if(idx===undefined)return;

            const player =
                String(
                    d.player||""
                ).toLowerCase();

            if(
                player!=="player1" &&
                player!=="player2"
            ){

                return;

            }

            const buttons =
                document.querySelectorAll(
                    ".choice"
                );

            const button =
                buttons[idx];

            if(!button)return;

            if(
                !button.classList.contains(
                    "revealed"
                )
            ){

                button.classList.add(
                    "revealed"
                );

                revealedChoices++;

            }

            if(button.disabled)return;

            selectAnswer(
                idx,
                button,
                player
            );

        }
    );

}

function teamBuzz(team){

    if(
        answered ||
        revealedChoices<1 ||
        !quizStarted
    ){

        return;

    }

    if(currentTeam===0){

        currentTeam=team;

        stopBuzzTimer();

        publishQuizState(
            "BUZZ",
            team===1
            ?"player1"
            :"player2"
        );

        if(team===1){

            team1Box.classList.add(
                "buzzer-winner"
            );

            team2Box.classList.add(
                "hidden-team"
            );

            buzz1.innerText =
                "🔵 PLAYER 1 BUZZED!";

            buzz2.innerText="";

        }else{

            team2Box.classList.add(
                "buzzer-winner"
            );

            team1Box.classList.add(
                "hidden-team"
            );

            buzz2.innerText =
                "🔴 PLAYER 2 BUZZED!";

            buzz1.innerText="";

        }

        startAnswerAfterBuzz();

        sendScreenState();

        return;

    }

    if(
        currentTeam===3 &&
        team===2
    ){

        currentTeam=2;

        team1Box.classList.add(
            "hidden-team"
        );

        team2Box.classList.remove(
            "hidden-team"
        );

        team2Box.classList.add(
            "buzzer-winner"
        );

        buzz2.innerText =
            "🔴 PLAYER 2 STEAL!";

        publishQuizState(
            "STEAL",
            "player2"
        );

        startAnswerAfterBuzz();

        sendScreenState();

        return;

    }

    if(
        currentTeam===4 &&
        team===1
    ){

        currentTeam=1;

        team2Box.classList.add(
            "hidden-team"
        );

        team1Box.classList.remove(
            "hidden-team"
        );

        team1Box.classList.add(
            "buzzer-winner"
        );

        buzz1.innerText =
            "🔵 PLAYER 1 STEAL!";

        publishQuizState(
            "STEAL",
            "player1"
        );

        startAnswerAfterBuzz();

        sendScreenState();

    }

}

                ". "+
                q.choices[index];

            b.disabled=false;

            b.onclick=()=>{

                if(
                    timerMode==="buzz" ||
                    timerMode==="answer" ||
                    timerMode==="steal"
                ){

                    return;

                }

                if(
                    !b.classList.contains(
                        "revealed"
                    )
                ){

                    b.classList.add(
                        "revealed"
                    );

                    revealedChoices++;

                    publishQuizState(
                        currentTeam===0
                        ?"WAITING"
                        :"BUZZ",

                        currentTeam===1 ||
                        currentTeam===4
                        ?"player1"
                        :
                        currentTeam===2 ||
                        currentTeam===3
                        ?"player2"
                        :
                        null
                    );

                    sendScreenState();

                }

                if(currentTeam===0){

                    if(
                        revealedChoices>=4
                    ){

                        startBuzzTimer();

                    }

                    return;

                }

                selectAnswer(
                    index,
                    b
                );

            };

            choicesElement.appendChild(b);

        }
    );

    stopTimers();
    hideTimer();

    messageElement.innerText="";

    publishRoundStart();

    sendScreenState();

}

/* =========================================================
   TIMERS
========================================================= */

function stopTimers(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer=null;

    }

    if(answerTimer){

        clearInterval(
            answerTimer
        );

        answerTimer=null;

    }

}

function stopBuzzTimer(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer=null;

    }

}

function stopTimerSound(){

    timerSound.pause();

    timerSound.currentTime=0;

    timerSound.onended=null;

}

function showTimer(
    seconds,
    mode
){

    timerMode=mode;

    timerSeconds=seconds;

    timerElement.style.display =
        "block";

    timerElement.innerText =
        seconds;

    timerElement.style.borderColor =
        mode==="buzz"
        ?" #f1c40f"
        :"#e67e22";

    timerElement.style.color =
        mode==="buzz"
        ?" #f1c40f"
        :"#e67e22";

    publishQuizState(
        mode==="buzz"
        ?"READY"
        :"BUZZ",

        currentTeam===1 ||
        currentTeam===4
        ?"player1"
        :
        currentTeam===2 ||
        currentTeam===3
        ?"player2"
        :
        null
    );

}

function hideTimer(){

    timerElement.style.display =
        "none";

    timerSeconds=0;
    timerMode="";

}

/* =========================================================
   TIMER AUDIO
========================================================= */

function playFullTimerSound(){

    stopTimerSound();

    timerSound.currentTime=0;

    timerSound.play().catch(()=>{});

}

function playLastFiveSeconds(){

    stopTimerSound();

    timerSound.currentTime=5;

    timerSound.play().catch(()=>{});

}

/* =========================================================
   BUZZ COUNTDOWN
========================================================= */

function startBuzzTimer(){

    stopTimers();

    showTimer(
        10,
        "buzz"
    );

    /*
     * Walang timer sound dito.
     */

    publishQuizState(
        "READY",
        null
    );

    sendScreenState();

    buzzTimer =
        setInterval(()=>{

            /*
             * Kapag may nakapag-buzz,
             * itigil agad ang buzz timer.
             */

            if(currentTeam!==0){

                stopBuzzTimer();

                return;

            }

            timerSeconds--;

            timerElement.innerText =
                timerSeconds;

            sendScreenState();

            /*
             * ==============================================
             * BUZZ TIMER Tapos
             * ==============================================
             */

            if(
                timerSeconds<=0
            ){

                stopBuzzTimer();

                hideTimer();


                /*
                 * IMPORTANT:
                 * I-lock ang round.
                 *
                 * Dahil answered=true,
                 * hindi na tatanggap ang teamBuzz()
                 * mula sa Firebase/controller.
                 */

                answered=true;

                currentTeam=0;

                answerResult="";


                /*
                 * Disable choices para walang
                 * accidental answer.
                 */

                document
                    .querySelectorAll(".choice")
                    .forEach(b=>{

                        b.disabled=true;

                    });


                /*
                 * Message para sa HOST
                 */

                messageElement.innerText =
                    "⏰ BUZZ TIME OVER — Press Enter for next question";


                /*
                 * Firebase state
                 */

                publishQuizState(
                    "FINISHED",
                    null
                );


                sendScreenState();

            }

        },1000);

}

/* =========================================================
   NORMAL ANSWER TIMER
========================================================= */

function startAnswerTimer(){

    stopTimers();

    showTimer(
        10,
        "answer"
    );

    playFullTimerSound();

    answerTimer =
        setInterval(()=>{

            timerSeconds--;

            timerElement.innerText =
                timerSeconds;

            sendScreenState();

            if(
                timerSeconds<=0
            ){

                clearInterval(
                    answerTimer
                );

                answerTimer=null;

                handleAnswerTimeout();

            }

        },1000);

}

/* =========================================================
   STEAL TIMER
========================================================= */

function startStealTimer(){

    stopTimers();

    showTimer(
        5,
        "steal"
    );

    playLastFiveSeconds();

    answerTimer =
        setInterval(()=>{

            timerSeconds--;

            timerElement.innerText =
                timerSeconds;

            sendScreenState();

            if(
                timerSeconds<=0
            ){

                clearInterval(
                    answerTimer
                );

                answerTimer=null;

                handleAnswerTimeout();

            }

        },1000);

}

/* =========================================================
   ANSWER TIMEOUT
========================================================= */

function handleAnswerTimeout(){

    if(answered)return;

    stopTimers();
    stopTimerSound();
    hideTimer();

    document
        .querySelectorAll(".choice")
        .forEach(b=>{

            b.disabled=true;

        });

    answerAttempts++;

    wrongSound.currentTime=0;

    wrongSound.play().catch(()=>{});

    if(answerAttempts>=2){

        revealCorrectAnswer();

        return;

    }

    prepareNextAttempt();

}

/* =========================================================
   REVEAL CORRECT
========================================================= */

function revealCorrectAnswer(){

    const q =
        questions[currentQuestion];

    const buttons =
        document.querySelectorAll(
            ".choice"
        );

    buttons.forEach(
        (b,i)=>{

            b.disabled=true;

            if(i===q.answer){

                b.classList.add(
                    "correct"
                );

            }

        }
    );

    selectedAnswerIndex =
        q.answer;

    answerResult="correct";
    answered=true;

    stopTimers();
    stopTimerSound();
    hideTimer();

    messageElement.innerText =
        "Press Enter for next question";

    publishQuizState(
        "FINISHED",
        null
    );

    sendScreenState();

}

/* =========================================================
   PREPARE STEAL
========================================================= */

function prepareNextAttempt(){

    if(answerAttempts>=2){

        revealCorrectAnswer();

        return;

    }

    if(
        currentTeam===1 ||
        currentTeam===4
    ){

        lockedTeam=1;
        currentTeam=3;

        team1Box.classList.add(
            "hidden-team"
        );

        team2Box.classList.remove(
            "hidden-team"
        );

        team2Box.classList.add(
            "buzzer-winner"
        );

        buzz1.innerText =
            "❌ WRONG";

        buzz2.innerText =
            "🔴 STEAL";

        publishQuizState(
            "STEAL",
            "player2"
        );

    }else{

        lockedTeam=2;
        currentTeam=4;

        team2Box.classList.add(
            "hidden-team"
        );

        team1Box.classList.remove(
            "hidden-team"
        );

        team1Box.classList.add(
            "buzzer-winner"
        );

        buzz2.innerText =
            "❌ WRONG";

        buzz1.innerText =
            "🔵 STEAL";

        publishQuizState(
            "STEAL",
            "player1"
        );

    }

    startStealTimer();

    sendScreenState();

}

/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(
    index,
    button,
    player=null
){

    if(
        answered ||
        currentTeam===0
    ){

        return;

    }

    if(
        !button.classList.contains(
            "revealed"
        )
    ){

        button.classList.add(
            "revealed"
        );

        revealedChoices++;

        publishQuizState(
            "BUZZ",

            currentTeam===1 ||
            currentTeam===4
            ?"player1"
            :"player2"
        );

        sendScreenState();

    }

    let answeringTeam=0;

    if(player==="player1"){

        answeringTeam=1;

    }
    else if(player==="player2"){

        answeringTeam=2;

    }
    else{

        answeringTeam =
            (
                currentTeam===1 ||
                currentTeam===4
            )
            ?1
            :2;

    }

    if(
        lockedTeam===
        answeringTeam
    ){

        return;

    }

    if(
        answeringTeam===1 &&
        currentTeam!==1 &&
        currentTeam!==4
    ){

        return;

    }

    if(
        answeringTeam===2 &&
        currentTeam!==2 &&
        currentTeam!==3
    ){

        return;

    }

    const q =
        questions[currentQuestion];

    const buttons =
        document.querySelectorAll(
            ".choice"
        );

    selectedAnswerIndex=index;

    if(index===q.answer){

        answered=true;

        answerResult="correct";

        stopTimers();
        stopTimerSound();
        hideTimer();

        button.classList.remove(
            "revealed",
            "wrong"
        );

        button.classList.add(
            "correct"
        );

        buttons.forEach(
            b=>b.disabled=true
        );

        correctSound.currentTime=0;

        correctSound.play().catch(()=>{});

        publishQuizState(
            "FINISHED",
            null
        );

        if(answeringTeam===1){

            scoreTeam1++;

            score1Element.innerText =
                scoreTeam1;

        }else{

            scoreTeam2++;

            score2Element.innerText =
                scoreTeam2;

        }

        messageElement.innerText =
            "Press Enter for next question";

        sendScreenState();

        playCorrectBGM();

        return;

    }

    answerResult="wrong";

    button.classList.add(
        "wrong"
    );

    button.disabled=true;

    wrongSound.currentTime=0;

    wrongSound.play().catch(()=>{});

    stopTimers();
    stopTimerSound();
    hideTimer();

    answerAttempts++;
    lockedTeam=answeringTeam;

    if(answerAttempts>=2){

        revealCorrectAnswer();

        return;

    }

    prepareNextAttempt();

}

/* =========================================================
   KEYBOARD ANSWERS
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName==="INPUT" ||
            e.target.tagName==="TEXTAREA"
        ){

            return;

        }

        if(e.code==="Space"){

            return;

        }

        if(
            answered ||
            currentTeam===0 ||
            !quizStarted
        ){

            return;

        }

        if(
            timerMode==="buzz" ||
            timerMode==="answer" ||
            timerMode==="steal"
        ){

            return;

        }

        const map={

            z:0,
            x:1,
            c:2,
            v:3

        };

        const key =
            e.key.toLowerCase();

        if(!(key in map))return;

        const index =
            map[key];

        const b =
            document
            .querySelectorAll(
                ".choice"
            )[index];

        if(!b)return;

        if(b.disabled)return;

        e.preventDefault();

        if(
            !b.classList.contains(
                "revealed"
            )
        ){

            b.classList.add(
                "revealed"
            );

            revealedChoices++;

            publishQuizState(
                "BUZZ",

                currentTeam===1 ||
                currentTeam===4
                ?"player1"
                :"player2"
            );

            sendScreenState();

        }

        selectAnswer(
            index,
            b
        );

    }
);

/* =========================================================
   NEXT QUESTION
========================================================= */

nextQuestionBtn.onclick=async()=>{

    if(!answered){

        return;

    }

    if(bgm1Fading){

        return;

    }

    autoNextAfterBgm1=false;

    stopTimers();
    stopTimerSound();
    hideTimer();

    if(currentBgm1){

        await new Promise(
            r=>fadeOutBgm1(r)
        );

    }else{

        bgm1Variants.forEach(
            resetBgm1
        );

    }

    await playAudio(
        bgm2
    );

    nextQuestion();

};

/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(!answered){

        return;

    }

    stopTimers();
    stopTimerSound();
    hideTimer();

    questionPosition++;

    if(
        questionPosition>=
        questionOrder.length
    ){

        finishQuiz();

        return;

    }

    loadQuestion();

}

/* =========================================================
   FINISH
========================================================= */

function finishQuiz(){

    stopAudio(bgm);
    stopAudio(bgm2);

    bgm1Variants.forEach(
        resetBgm1
    );

    currentBgm1=null;
    autoNextAfterBgm1=false;

    clearBgm1Fade();

    stopTimers();
    stopTimerSound();
    hideTimer();

    questionElement.innerText="";
    choicesElement.innerHTML="";
    progressElement.innerText="";

    messageElement.innerText =
        "🏆 QUIZ FINISHED";

    if(
        firebaseConnected &&
        roomRef
    ){

        roomRef.child("state").set({

            phase:
                "QUIZ_FINISHED",

            round:
                currentQuestion+1,

            scoreTeam1,
            scoreTeam2,

            at:
                firebase.database
                .ServerValue
                .TIMESTAMP

        });

    }

    sendScreenState();

}

/* =========================================================
   RANDOM QUESTION ORDER
========================================================= */

function createRandomQuestionOrder(){

    questionOrder =
        Array.from(
            {
                length:questions.length
            },
            (_,i)=>i
        );

    for(
        let i=
            questionOrder.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random()*
                (i+1)
            );

        [
            questionOrder[i],
            questionOrder[j]
        ]=[
            questionOrder[j],
            questionOrder[i]
        ];

    }

    questionPosition=0;

}

/* =========================================================
   START QUIZ
========================================================= */

function startQuiz(){

    if(!questions.length){

        alert(
            "Please upload questions first."
        );

        return;

    }

    quizStarted=true;

    scoreTeam1=0;
    scoreTeam2=0;

    score1Element.innerText="0";
    score2Element.innerText="0";

    createRandomQuestionOrder();

    startOverlay.classList.remove(
        "show"
    );

    startQuizBtn.style.display =
        "none";

    menuPanel.classList.remove(
        "show"
    );

    loadQuestion();

    messageElement.innerText =
        "🎯 QUIZ STARTED";

}

startQuizBtn.onclick=()=>{

    startQuiz();

};

bigStartBtn.onclick=()=>{

    startQuiz();

};

/* =========================================================
   UPLOAD QUESTIONS
========================================================= */

const questionsFile =
    document.getElementById(
        "questionsFile"
    );

questionsFile.addEventListener(
    "change",
    async e=>{

        const file =
            e.target.files[0];

        if(!file)return;

        if(
            !file.name
            .toLowerCase()
            .endsWith(".json")
        ){

            alert(
                "Please upload a JSON questions file."
            );

            questionsFile.value="";

            return;

        }

        try{

            const text =
                await file.text();

            const data =
                JSON.parse(text);

            let loadedQuestions=[];

            if(Array.isArray(data)){

                loadedQuestions=data;

            }
            else if(
                data &&
                Array.isArray(
                    data.questions
                )
            ){

                loadedQuestions =
                    data.questions;

            }
            else{

                throw new Error(
                    "Invalid JSON format."
                );

            }

            loadedQuestions =
                loadedQuestions.filter(q=>{

                    return(

                        q &&

                        typeof q.question===
                            "string" &&

                        Array.isArray(
                            q.choices
                        ) &&

                        q.choices.length>=4 &&

                        (
                            typeof q.answer===
                                "number" ||

                            typeof q.correct===
                                "number" ||

                            typeof q.correct===
                                "string"
                        )

                    );

                });

            if(
                !loadedQuestions.length
            ){

                throw new Error(
                    "No valid questions found."
                );

            }

            questions =
                loadedQuestions.map(q=>{

                    let answer;

                    if(
                        typeof q.answer===
                            "number"
                    ){

                        answer=q.answer;

                    }
                    else if(
                        typeof q.correct===
                            "number"
                    ){

                        answer=q.correct;

                    }
                    else{

                        const letter =
                            String(
                                q.correct
                            )
                            .trim()
                            .toUpperCase();

                        answer={

                            A:0,
                            B:1,
                            C:2,
                            D:3

                        }[letter];

                    }

                    return{

                        question:
                            q.question,

                        choices:
                            q.choices
                            .slice(0,4),

                        answer

                    };

                });

            questions =
                questions.filter(q=>{

                    return(

                        Number.isInteger(
                            q.answer
                        ) &&

                        q.answer>=0 &&

                        q.answer<4

                    );

                });

            if(!questions.length){

                throw new Error(
                    "No valid answers found."
                );

            }

            currentQuestion=0;
            questionPosition=0;
            quizStarted=false;

            scoreTeam1=0;
            scoreTeam2=0;

            score1Element.innerText="0";
            score2Element.innerText="0";

            saveQuestions();

            startQuizBtn.disabled=false;

            startQuizBtn.style.display =
                "inline-block";

            startInfo.innerText =
                `${questions.length} questions loaded. Ready to start!`;

            messageElement.innerText =
                `✅ ${questions.length} questions loaded. Click START QUIZ.`;

            questionElement.innerText =
                "QUESTIONS READY";

            progressElement.innerText =
                `${questions.length} questions loaded`;

            choicesElement.innerHTML="";

            startOverlay.classList.add(
                "show"
            );

            alert(
                `✅ ${questions.length} questions loaded successfully!\n\nClick START QUIZ to begin.`
            );

        }catch(error){

            console.error(
                "Question JSON error:",
                error
            );

            alert(
                "❌ Failed to load questions.\n\n"+
                error.message
            );

            questions=[];

            questionsFile.value="";

            startQuizBtn.disabled=true;

        }

    }
);

/* =========================================================
   SAVE ROOM
========================================================= */

function saveRoomNumber(){

    const room =
        roomInput.value.trim();

    if(!room)return;

    localStorage.setItem(
        STORAGE_KEYS.ROOM,
        room
    );

}

/* =========================================================
   LOAD ROOM
========================================================= */

function loadSavedRoom(){

    const savedRoom =
        localStorage.getItem(
            STORAGE_KEYS.ROOM
        );

    if(savedRoom){

        roomInput.value =
            savedRoom;

    }

}

/* =========================================================
   SAVE QUESTIONS
========================================================= */

function saveQuestions(){

    if(!questions.length)return;

    try{

        localStorage.setItem(
            STORAGE_KEYS.QUESTIONS,
            JSON.stringify(
                questions
            )
        );

    }catch(error){

        console.error(
            "Failed to save questions:",
            error
        );

        alert(
            "Hindi ma-save ang questions sa browser."
        );

    }

}

/* =========================================================
   LOAD SAVED QUESTIONS
========================================================= */

function loadSavedQuestions(){

    try{

        const saved =
            localStorage.getItem(
                STORAGE_KEYS.QUESTIONS
            );

        if(!saved)return false;

        const parsed =
            JSON.parse(saved);

        if(
            !Array.isArray(parsed) ||
            !parsed.length
        ){

            return false;

        }

        questions=parsed;

        currentQuestion=0;
        questionPosition=0;
        quizStarted=false;

        scoreTeam1=0;
        scoreTeam2=0;

        score1Element.innerText="0";
        score2Element.innerText="0";

        startQuizBtn.disabled=false;

        startQuizBtn.style.display =
            "inline-block";

        questionElement.innerText =
            "QUESTIONS READY";

        progressElement.innerText =
            `${questions.length} saved questions`;

        messageElement.innerText =
            `💾 ${questions.length} saved questions loaded. Click START QUIZ.`;

        return true;

    }catch(error){

        console.error(
            "Saved questions error:",
            error
        );

        localStorage.removeItem(
            STORAGE_KEYS.QUESTIONS
        );

        return false;

    }

}

/* =========================================================
   ROOM INPUT
========================================================= */

roomInput.addEventListener(

        );

   ROOM ENTER

roomInput.addEventListener(

            connectBtn.click();

/* =========================================================
   PAGE EXIT
========================================================= */

window.addEventListener(
    "beforeunload",
    ()=>{

        /*
         * Firebase onDisconnect()
         * ang bahala sa host lock.
         */

    }

/* =========================================================
   RESTORE
========================================================= */

loadSavedRoom();

const restored =
    loadSavedQuestions();

if(!restored){

    progressElement.innerText =

    choicesElement.innerHTML="";

    messageElement.innerText =

========================================================= */

window.addEventListener(

    ()=>{

        const savedRoom =
            localStorage.getItem(

        roomInput.value =

        );
