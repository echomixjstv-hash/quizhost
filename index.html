<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Team Quiz - Host</title>

<style>

*{
    box-sizing:border-box
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#101010;
    color:#fff
}

.game{
    width:100%;
    height:100vh;
    padding:12px;
    display:flex;
    flex-direction:column
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px
}

.title{
    font-size:25px;
    font-weight:bold
}

.status{
    padding:7px 14px;
    border-radius:20px;
    background:#555;
    font-size:13px
}

.status.connected{
    background:#159447
}

.scores{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:10px
}

.team{
    flex:1;
    max-width:50%;
    text-align:center;
    padding:15px;
    border-radius:16px;
    background:#202020;
    border:4px solid;
    min-height:120px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:all .4s ease,opacity .3s ease
}

.team1{
    border-color:#3498db;
    color:#3498db
}

.team2{
    border-color:#e74c3c;
    color:#e74c3c
}

.team.buzzer-winner{
    flex:0 0 70%;
    max-width:70%;
    min-height:170px;
    animation:winnerGlow .7s infinite
}

.team.hidden-team{
    flex:0 0 0%;
    max-width:0;
    width:0;
    padding:0;
    margin:0;
    opacity:0;
    transform:scale(0);
    overflow:hidden;
    border-width:0
}

@keyframes winnerGlow{

    0%,100%{
        box-shadow:0 0 5px transparent
    }

    50%{
        box-shadow:
        0 0 15px currentColor,
        0 0 35px currentColor,
        0 0 60px currentColor;
        border-color:#fff
    }

}

.team-name{
    font-size:30px;
    font-weight:bold
}

.team-score{
    font-size:65px;
    font-weight:bold;
    line-height:1;
    margin:5px 0
}

.buzz{
    min-height:25px;
    font-size:18px;
    font-weight:bold
}

.question-box{
    flex:1;
    width:100%;
    max-width:950px;
    margin:auto;
    background:#fff;
    color:#111;
    border-radius:15px;
    padding:20px;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:0
}

.progress{
    color:#666;
    font-size:15px;
    margin-bottom:12px
}

.question{
    font-size:28px;
    font-weight:bold;
    margin-bottom:22px
}

.choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px
}

.choice{
    width:100%;
    padding:16px;
    border:0;
    border-radius:10px;
    background:#e5e5e5;
    font-size:18px;
    cursor:pointer;
    text-align:left;
    transition:.2s
}

.choice:hover:not(:disabled){
    background:#d5d5d5;
    transform:scale(1.01)
}

/*
    REVEALED CHOICE
*/
.choice.revealed{
    background:#9edcff!important
}

/*
    CORRECT
*/
.choice.correct{
    background:#20a35a!important;
    color:#fff!important
}

/*
    WRONG
*/
.choice.wrong{
    background:#e74c3c!important;
    color:#fff!important
}

/*
    Disabled only after answer
*/
.choice:disabled{
    cursor:not-allowed
}

.message{
    min-height:30px;
    margin-top:15px;
    font-size:19px;
    font-weight:bold
}

.bottom{
    height:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap
}

.control-btn{
    border:0;
    border-radius:8px;
    padding:9px 18px;
    font-size:14px;
    cursor:pointer
}

.connect{
    background:#3498db;
    color:#fff
}

.second-screen{
    background:#8e44ad;
    color:#fff
}

#timer{
    display:none;
    margin:8px auto;
    padding:8px 18px;
    width:max-content;
    min-width:90px;
    border:3px solid #f1c40f;
    border-radius:12px;
    font-size:30px;
    font-weight:bold;
    background:#151515;
    color:#f1c40f
}

@media(max-width:600px){

    .title{
        font-size:18px
    }

    .question{
        font-size:22px
    }

    .choices{
        grid-template-columns:1fr
    }

    .team-score{
        font-size:50px
    }

    .bottom{
        height:auto
    }

}
.controller-btn{
    background:#f39c12;
    color:#fff;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}

.upload-btn{
    background:#16a085;
    color:#fff;
    cursor:pointer;
}
.generator-btn{
    background:#16a085;
    color:#fff;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    justify-content:center;
}
</style>
</head>

<body>

<div class="game">

<div class="top">

    <div class="title">
        🏆 TEAM QUIZ
    </div>

    <div id="connectionStatus" class="status">

    </div>

</div>


<div class="scores">

    <div id="team1Box" class="team team1">

        </div>

<div class="question-box">

<input

>

    <button

    </button>

    <button
        id="secondScreenBtn"

        🖥️ SECOND SCREEN
    </button>

    <a
    href="controller.html"
    class="control-btn controller-btn">
    🎮 CONTROLLER
</a>

<a
    href="question-generation.html"
    class="control-btn generator-btn">
    📝 QUESTION GENERATOR
</a>

</div>


</div>


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<script>

/* =========================================================
   AUDIO
========================================================= */

const bgm=new Audio("audio/bgm.mp3");

const bgm1Variants=[

    new Audio("audio/bgm1-1.mp3"),
    new Audio("audio/bgm1-2.mp3"),
    new Audio("audio/bgm1-3.mp3"),
    new Audio("audio/bgm1-4.mp3"),
    new Audio("audio/bgm1-5.mp3"),
    new Audio("audio/bgm1-6.mp3"),
    new Audio("audio/bgm1-7.mp3"),
    new Audio("audio/bgm1-8.mp3")

];

const bgm2=new Audio("audio/bgm2.mp3");

const correctSound=new Audio("audio/Fact.mp3");

const wrongSound=new Audio("audio/mali.mp3");

const timerSound=new Audio("audio/timer.mp3");


bgm.loop=true;
bgm.volume=.5;

bgm2.volume=.5;

timerSound.volume=.5;


bgm1Variants.forEach(a=>{
    a.loop=false;
    a.volume=.5;
});


let musicStarted=false;

let currentBgm1=null;

let bgm1FadeInterval=null;

let bgm1Fading=false;

let autoNextAfterBgm1=false;


async function playAudio(a){

    try{

        await a.play();

        return true;

    }catch(e){

        console.log("Audio blocked:",e);

        return false;

    }

}


function stopAudio(a){

    a.pause();

    a.currentTime=0;

}


async function startInitialBGM(){

    if(musicStarted)return;

    musicStarted=true;

    await playAudio(bgm);

}


document.addEventListener(
    "click",
    startInitialBGM,
    {once:true}
);


function clearBgm1Fade(){

    if(bgm1FadeInterval){

        clearInterval(bgm1FadeInterval);

        bgm1FadeInterval=null;

    }

    bgm1Fading=false;

}


function resetBgm1(a){

    a.onended=null;

    a.pause();

    a.currentTime=0;

    a.volume=.5;

}


function fadeOutBgm1(callback){

    const a=currentBgm1;

    if(!a){

        if(callback)callback();

        return;

    }

    if(bgm1Fading)return;

    bgm1Fading=true;

    const start=a.volume;

    const steps=30;

    let n=0;


    bgm1FadeInterval=setInterval(()=>{

        n++;

        a.volume=Math.max(
            0,
            start*(1-n/steps)
        );


        if(n>=steps){

            clearInterval(bgm1FadeInterval);

            bgm1FadeInterval=null;

            a.pause();

            a.currentTime=0;

            a.volume=.5;

            a.onended=null;


            if(currentBgm1===a){
                currentBgm1=null;
            }


            bgm1Fading=false;


            if(callback){
                callback();
            }

        }

    },50);

}


async function startQuizBGM(){

    stopAudio(bgm);

    stopAudio(bgm2);


    if(currentBgm1){

        await new Promise(
            r=>fadeOutBgm1(r)
        );

    }


    bgm1Variants.forEach(resetBgm1);

    await playAudio(bgm2);

}


async function playCorrectBGM(){

    stopAudio(bgm2);

    stopAudio(bgm);

    bgm1Variants.forEach(resetBgm1);

    clearBgm1Fade();


    const a=
        bgm1Variants[
            Math.floor(
                Math.random()*bgm1Variants.length
            )
        ];


    currentBgm1=a;

    autoNextAfterBgm1=true;


    a.onended=()=>{

        if(currentBgm1!==a)return;

        a.currentTime=0;

        a.play().catch(()=>{});


        fadeOutBgm1(()=>{

            if(autoNextAfterBgm1){

                autoNextAfterBgm1=false;

                startNextQuestionAfterBgm1();

            }

        });

    };


    await playAudio(a);

}


async function startNextQuestionAfterBgm1(){

    stopTimers();

    stopTimerSound();

    hideTimer();

    await startQuizBGM();

    nextQuestion();

}


/* =========================================================
   GAME STATE
========================================================= */

let currentQuestion=0;

let scoreTeam1=0;

let scoreTeam2=0;

let currentTeam=0;

let answered=false;

let answerAttempts=0;

let revealedChoices=0;

let lockedTeam=0;

let selectedAnswerIndex=-1;

let answerResult="";


let buzzTimer=null;

let answerTimer=null;

let timerSeconds=0;

let timerMode="";


let roomNumber="";

let roomRef=null;

let firebaseConnected=false;

let lastRemoteTimestamp=0;

let remoteListenerStarted=false;


/* =========================================================
   ELEMENTS
========================================================= */

const connectionStatus=
    document.getElementById(
        "connectionStatus"
    );

const connectBtn=
    document.getElementById(
        "connectBtn"
    );

const questionElement=
    document.getElementById(
        "question"
    );

const choicesElement=
    document.getElementById(
        "choices"
    );

const progressElement=
    document.getElementById(
        "progress"
    );

const messageElement=
    document.getElementById(
        "message"
    );

const score1Element=
    document.getElementById(
        "score1"
    );

const score2Element=
    document.getElementById(
        "score2"
    );

const team1Box=
    document.getElementById(
        "team1Box"
    );

const team2Box=
    document.getElementById(
        "team2Box"
    );

const buzz1=
    document.getElementById(
        "buzz1"
    );

const buzz2=
    document.getElementById(
        "buzz2"
    );

const timerElement=
    document.getElementById(
        "timer"
    );


/* =========================================================
   FIREBASE
========================================================= */

const firebaseConfig={

    apiKey:"AIzaSyAKzNpD9BeiT-eym0e1l_U3p_dggPrbEk",

    authDomain:
        "jess-santi.firebaseapp.com",

    databaseURL:
        "https://jess-santi-default-rtdb.firebaseio.com/",

    projectId:
        "jess-santi",

    storageBucket:
        "jess-santi.firebasestorage.app",

    messagingSenderId:
        "457562056307",

    appId:
        "1:457562056307:web:1be6c76bc8bdb5bd0aac06",

    measurementId:
        "G-SKL83F1C8B"

};


firebase.initializeApp(firebaseConfig);


const db=
    firebase.database();


/* =========================================================
   SECOND SCREEN
========================================================= */

const screenChannel=
    new BroadcastChannel(
        "team-quiz-screen"
    );


function sendScreenState(){

    screenChannel.postMessage({

        type:"STATE",

        question:
            questions[currentQuestion]||null,

        currentQuestion,

        total:
            questions.length,

        currentTeam,

        scoreTeam1,

        scoreTeam2,

        answered,

        timerSeconds,

        timerMode,

        revealedChoices,

        answerAttempts,

        selectedAnswer:
            selectedAnswerIndex,

        answerResult

    });

}


document.getElementById(
    "secondScreenBtn"
).onclick=()=>{

    const w=
        window.open(
            "second-screen.html",
            "TeamQuizSecondScreen",
            "width=1280,height=720,resizable=yes"
        );


    if(!w){

        alert(
            "Hindi nabuksan ang Second Screen. I-allow ang pop-ups."
        );

        return;

    }


    setTimeout(
        sendScreenState,
        500
    );

};


screenChannel.onmessage=e=>{

    if(
        e.data &&
        e.data.type==="REQUEST_STATE"
    ){

        sendScreenState();

    }

};


/* =========================================================
   PUBLISH FIREBASE STATE
========================================================= */

function publishQuizState(
    phase,
    allowedPlayer
){

    if(
        !firebaseConnected ||
        !roomRef
    )return;


    roomRef.child("state").set({

        phase,

        round:
            currentQuestion+1,

        attempt:
            Math.max(
                1,
                answerAttempts
            ),

        allowedPlayer:
            allowedPlayer||null,

        player:
            (
                currentTeam===1 ||
                currentTeam===4
            )
            ?"player1"
            :
            (
                currentTeam===2 ||
                currentTeam===3
            )
            ?"player2"
            :null,

        correct:
            answerResult==="correct",

        revealedChoices,

        timerSeconds,

        timerMode,

        at:
            firebase.database.ServerValue.TIMESTAMP

    }).catch(console.error);

}


function publishRoundStart(){

    if(
        !firebaseConnected ||
        !roomRef
    )return;


    roomRef.update({

        round:
            currentQuestion+1,

        buzzer:null,

        answer:null,

        state:{

            phase:"WAITING",

            round:
                currentQuestion+1,

            attempt:1,

            allowedPlayer:null,

            at:
                firebase.database.ServerValue.TIMESTAMP

        }

    }).catch(console.error);

}


/* =========================================================
   CONNECT
========================================================= */

connectBtn.onclick=async()=>{

    await startInitialBGM();


    const value=
        document
        .getElementById("roomInput")
        .value
        .trim();


    if(!value){

        alert(
            "Enter a room number first."
        );

        return;

    }


    roomNumber=value;


    roomRef=
        db.ref(
            "rooms/"+roomNumber
        );


    try{

        const snap=
            await roomRef
            .child("round")
            .once("value");


        if(
            snap.val()===null
        ){

            await roomRef
            .child("round")
            .set(1);

        }


        firebaseConnected=true;


        connectionStatus.innerText=
            "Firebase: Connected • Room "+
            roomNumber;


        connectionStatus
            .classList
            .add("connected");


        connectBtn.innerText=
            "✓ ROOM CONNECTED";


        listenFirebase();

        listenRemoteButtons();


        roomRef
            .child("remoteButton")
            .once("value")
            .then(s=>{

                const d=s.val();

                if(
                    d &&
                    d.timestamp
                ){

                    lastRemoteTimestamp=
                        Number(d.timestamp);

                }

            });


        publishQuizState(
            "WAITING",
            null
        );


    }catch(e){

        console.error(e);

        alert(
            "Firebase connection error. Check Realtime Database Rules."
        );

    }

};


/* =========================================================
   FIREBASE LISTENERS
========================================================= */

function listenFirebase(){

    roomRef
    .child("buzzer")
    .on("value",snap=>{

        const d=snap.val();


        if(
            !d ||
            Number(d.round)!==
                currentQuestion+1 ||
            answered
        )return;


        teamBuzz(
            d.player==="player1"
            ?1
            :2
        );

    });


    roomRef
    .child("answer")
    .on("value",snap=>{

        const d=snap.val();


        if(
            !d ||
            Number(d.round)!==
                currentQuestion+1 ||
            answered
        )return;


        const idx={

            A:0,
            B:1,
            C:2,
            D:3

        }[
            String(
                d.answer||""
            ).toUpperCase()
        ];


        if(idx===undefined)return;


        const buttons=
            document.querySelectorAll(
                ".choice"
            );


        const button=
            buttons[idx];


        if(!button)return;


        const p=
            String(
                d.player||""
            ).toLowerCase();


        if(
            p!=="player1" &&
            p!=="player2"
        )return;


        /*
            IMPORTANT:
            Kahit hindi pa revealed,
            automatic natin itong ire-reveal.
        */

        if(
            !button.classList.contains(
                "revealed"
            )
        ){

            button.classList.add(
                "revealed"
            );

            revealedChoices++;

        }


        if(button.disabled)return;


        selectAnswer(
            idx,
            button,
            p
        );

    });

}


/* =========================================================
   REMOTE BUTTON LISTENER
========================================================= */

function listenRemoteButtons(){

    if(
        !roomRef ||
        remoteListenerStarted
    )return;


    remoteListenerStarted=true;


    roomRef
    .child("remoteButton")
    .on("value",snap=>{

        const d=snap.val();

        if(!d)return;


        const timestamp=
            Number(
                d.timestamp||0
            );


        if(
            timestamp<=
            lastRemoteTimestamp
        )return;


        lastRemoteTimestamp=
            timestamp;


        if(
            d.round &&
            Number(d.round)!==
                currentQuestion+1
        )return;


        const command=
            String(
                d.command||""
            ).toUpperCase();


        /* TEAM 1 BUZZ */

        if(command==="TEAM1"){

            if(
                lockedTeam===1 ||
                currentTeam===3 ||
                currentTeam!==0
            )return;


            teamBuzz(1);

            return;

        }


        /* TEAM 2 BUZZ */

        if(command==="TEAM2"){

            if(
                lockedTeam===2 ||
                currentTeam===4 ||
                currentTeam!==0
            )return;


            teamBuzz(2);

            return;

        }


        const idx={

            A:0,
            B:1,
            C:2,
            D:3

        }[command];


        if(idx===undefined)return;


        const player=
            String(
                d.player||""
            ).toLowerCase();


        if(
            player!=="player1" &&
            player!=="player2"
        )return;


        if(
            player==="player1" &&
            (
                lockedTeam===1 ||
                (
                    currentTeam!==1 &&
                    currentTeam!==4
                )
            )
        )return;


        if(
            player==="player2" &&
            (
                lockedTeam===2 ||
                (
                    currentTeam!==2 &&
                    currentTeam!==3
                )
            )
        )return;


        const buttons=
            document.querySelectorAll(
                ".choice"
            );


        const button=
            buttons[idx];


        if(!button)return;


        /*
            AUTO REVEAL REMOTE ANSWER
        */

        if(
            !button.classList.contains(
                "revealed"
            )
        ){

            button.classList.add(
                "revealed"
            );

            revealedChoices++;

        }


        if(button.disabled)return;


        selectAnswer(
            idx,
            button,
            player
        );

    });

}


/* =========================================================
   NEXT BUTTON
========================================================= */

document.getElementById(
    "nextQuestionBtn"
).onclick=async()=>{

    if(!answered){

        alert(
            "Finish the current question first."
        );

        return;

    }


    autoNextAfterBgm1=false;

    stopTimers();

    stopTimerSound();

    hideTimer();


    if(currentBgm1){

        await new Promise(
            r=>fadeOutBgm1(r)
        );

    }


    await startQuizBGM();

    nextQuestion();

};


/* =========================================================
   REVEAL CHOICE USING ENTER
========================================================= */

function revealNextChoice(){

    if(answered)return;


    if(revealedChoices<4){

        revealedChoices++;


        const buttons=
            document.querySelectorAll(
                ".choice"
            );


        const b=
            buttons[
                revealedChoices-1
            ];


        if(b){

            b.classList.add(
                "revealed"
            );

        }


        publishQuizState(
            "WAITING",
            null
        );


        sendScreenState();

        return;

    }


    /*
        ENTER AFTER ALL 4:
        START BUZZER
    */

    if(revealedChoices===4){

        startBuzzTimer();

        publishQuizState(
            "READY",
            null
        );

        sendScreenState();

    }

}


document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName==="INPUT" ||
            e.target.tagName==="TEXTAREA"
        )return;


        if(e.key==="Enter"){

            e.preventDefault();

            revealNextChoice();

        }

    }
);


/* =========================================================
   BUZZER
========================================================= */

function teamBuzz(team){

    if(
        answered ||
        revealedChoices<1
    )return;


    /*
        FIRST BUZZ
    */

    if(currentTeam===0){

        currentTeam=team;

        stopBuzzTimer();


        publishQuizState(
            "BUZZ",
            team===1
            ?"player1"
            :"player2"
        );


        if(team===1){

            team1Box
                .classList
                .add("buzzer-winner");

            team2Box
                .classList
                .add("hidden-team");


            buzz1.innerText=
                "🔵 TEAM 1 BUZZED!";

            buzz2.innerText="";


        }else{

            team2Box
                .classList
                .add("buzzer-winner");

            team1Box
                .classList
                .add("hidden-team");


            buzz2.innerText=
                "🔴 TEAM 2 BUZZED!";

            buzz1.innerText="";

        }


        startAnswerAfterBuzz();

        sendScreenState();

        return;

    }


    /*
        TEAM 2 STEAL
    */

    if(
        currentTeam===3 &&
        team===2
    ){

        currentTeam=2;


        team1Box
            .classList
            .add("hidden-team");


        team2Box
            .classList
            .remove("hidden-team");


        team2Box
            .classList
            .add("buzzer-winner");


        buzz2.innerText=
            "🔴 TEAM 2 STEAL!";


        publishQuizState(
            "STEAL",
            "player2"
        );


        startAnswerAfterBuzz();

        sendScreenState();

        return;

    }


    /*
        TEAM 1 STEAL
    */

    if(
        currentTeam===4 &&
        team===1
    ){

        currentTeam=1;


        team2Box
            .classList
            .add("hidden-team");


        team1Box
            .classList
            .remove("hidden-team");


        team1Box
            .classList
            .add("buzzer-winner");


        buzz1.innerText=
            "🔵 TEAM 1 STEAL!";


        publishQuizState(
            "STEAL",
            "player1"
        );


        startAnswerAfterBuzz();

        sendScreenState();

    }

}


/* =========================================================
   START ANSWER
========================================================= */

function startAnswerAfterBuzz(){

    stopTimers();


    /*
        LAHAT NG CHOICES AY CLICKABLE
    */

    document
    .querySelectorAll(".choice")
    .forEach(b=>{

        if(!b.classList.contains("wrong")){

            b.disabled=false;

        }

    });


    publishQuizState(

        currentTeam===3 ||
        currentTeam===4
        ?"STEAL"
        :"BUZZ",

        currentTeam===1 ||
        currentTeam===4
        ?"player1"
        :"player2"

    );


    startAnswerTimer();

    sendScreenState();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    if(
        currentQuestion>=
        questions.length
    ){

        finishQuiz();

        return;

    }


    currentTeam=0;

    answered=false;

    answerAttempts=0;

    revealedChoices=0;

    lockedTeam=0;

    selectedAnswerIndex=-1;

    answerResult="";

    autoNextAfterBgm1=false;

    lastRemoteTimestamp=0;


    if(currentBgm1){

        currentBgm1.onended=null;

    }


    team1Box
        .classList
        .remove(
            "buzzer-winner",
            "hidden-team"
        );


    team2Box
        .classList
        .remove(
            "buzzer-winner",
            "hidden-team"
        );


    buzz1.innerText="Ready";

    buzz2.innerText="Ready";


    progressElement.innerText=
        `Question ${
            currentQuestion+1
        } / ${
            questions.length
        }`;


    const q=
        questions[currentQuestion];


    questionElement.innerText=
        q.question;


    choicesElement.innerHTML="";


    /*
        IMPORTANT CHANGE:
        ALL CHOICES ARE ENABLED FROM START.
    */

    ["A","B","C","D"]
    .forEach((letter,index)=>{

        const b=
            document.createElement(
                "button"
            );


        b.className="choice";


        b.innerText=
            letter+". "+
            q.choices[index];


        /*
            CLICKABLE AGAD
        */

        b.disabled=false;


        b.onclick=()=>{

            /*
                Kapag hindi pa revealed,
                reveal muna.
            */

            if(
                !b.classList.contains(
                    "revealed"
                )
            ){

                b.classList.add(
                    "revealed"
                );

                revealedChoices++;


                publishQuizState(
                    currentTeam===0
                    ?"WAITING"
                    :"BUZZ",

                    currentTeam===1 ||
                    currentTeam===4
                    ?"player1"
                    :
                    currentTeam===2 ||
                    currentTeam===3
                    ?"player2"
                    :null
                );


                sendScreenState();

            }


            /*
                Kung wala pang buzzer,
                reveal lang muna.
            */

            if(currentTeam===0){

                return;

            }


            /*
                May team na:
                check answer.
            */

            selectAnswer(
                index,
                b
            );

        };


        choicesElement.appendChild(b);

    });


    stopTimers();

    hideTimer();

    messageElement.innerText="";


    publishQuizState(
        "WAITING",
        null
    );


    sendScreenState();

}


/* =========================================================
   TIMERS
========================================================= */

function stopTimers(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer=null;

    }


    if(answerTimer){

        clearInterval(
            answerTimer
        );

        answerTimer=null;

    }

}


function stopBuzzTimer(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer=null;

    }

}


function stopTimerSound(){

    timerSound.pause();

    timerSound.currentTime=0;

    timerSound.onended=null;

}


function showTimer(
    seconds,
    mode
){

    timerMode=mode;

    timerSeconds=seconds;


    timerElement.style.display=
        "block";


    timerElement.innerText=
        seconds;


    timerElement.style.borderColor=
        mode==="buzz"
        ?" #f1c40f"
        :"#e67e22";


    timerElement.style.color=
        mode==="buzz"
        ?" #f1c40f"
        :"#e67e22";


    publishQuizState(

        mode==="buzz"
        ?"READY"
        :"BUZZ",

        currentTeam===1 ||
        currentTeam===4
        ?"player1"
        :
        currentTeam===2 ||
        currentTeam===3
        ?"player2"
        :null

    );

}


function hideTimer(){

    timerElement.style.display=
        "none";

    timerSeconds=0;

    timerMode="";

}


function startBuzzTimer(){

    stopTimers();


    showTimer(
        10,
        "buzz"
    );


    publishQuizState(
        "READY",
        null
    );


    buzzTimer=
        setInterval(()=>{

            timerSeconds--;

            timerElement.innerText=
                timerSeconds;


            sendScreenState();


            if(
                timerSeconds<=0
            ){

                stopBuzzTimer();

                hideTimer();


                publishQuizState(
                    "WAITING",
                    null
                );


                setTimeout(()=>{

                    if(!answered){

                        nextQuestion();

                    }

                },500);

            }

        },1000);

}


function startAnswerTimer(){

    stopTimers();


    showTimer(
        10,
        "answer"
    );


    timerSound.currentTime=0;

    timerSound
        .play()
        .catch(()=>{});


    answerTimer=
        setInterval(()=>{

            timerSeconds--;

            timerElement.innerText=
                timerSeconds;


            sendScreenState();


            if(
                timerSeconds<=0
            ){

                clearInterval(
                    answerTimer
                );

                answerTimer=null;

                handleAnswerTimeout();

            }

        },1000);

}


/* =========================================================
   ANSWER TIMEOUT
========================================================= */

function handleAnswerTimeout(){

    if(answered)return;


    stopTimers();

    stopTimerSound();

    hideTimer();


    document
    .querySelectorAll(".choice")
    .forEach(b=>{

        b.disabled=true;

    });


    answerAttempts++;


    wrongSound.currentTime=0;

    wrongSound
        .play()
        .catch(()=>{});


    /*
        MAXIMUM 2 ATTEMPTS:
        ORIGINAL + STEAL
    */

    if(answerAttempts>=2){

        revealCorrectAnswer();

        return;

    }


    prepareNextAttempt();

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

function revealCorrectAnswer(){

    const q=
        questions[currentQuestion];


    const buttons=
        document.querySelectorAll(
            ".choice"
        );


    buttons.forEach((b,i)=>{

        b.disabled=true;


        if(
            i===q.answer
        ){

            b.classList.add(
                "correct"
            );

        }

    });


    selectedAnswerIndex=
        q.answer;


    answerResult="correct";

    answered=true;


    stopTimers();

    stopTimerSound();

    hideTimer();


    publishQuizState(
        "FINISHED",
        null
    );


    sendScreenState();

}


/* =========================================================
   STEAL
========================================================= */

function prepareNextAttempt(){

    /*
        ONE STEAL ONLY
    */

    if(answerAttempts>=2){

        revealCorrectAnswer();

        return;

    }


    if(
        currentTeam===1 ||
        currentTeam===4
    ){

        lockedTeam=1;

        currentTeam=3;


        team1Box
            .classList
            .add("hidden-team");


        team2Box
            .classList
            .remove("hidden-team");


        team2Box
            .classList
            .add("buzzer-winner");


        buzz1.innerText=
            "❌ WRONG";


        buzz2.innerText=
            "🔴 STEAL";


        publishQuizState(
            "STEAL",
            "player2"
        );


    }else{

        lockedTeam=2;

        currentTeam=4;


        team2Box
            .classList
            .add("hidden-team");


        team1Box
            .classList
            .remove("hidden-team");


        team1Box
            .classList
            .add("buzzer-winner");


        buzz2.innerText=
            "❌ WRONG";


        buzz1.innerText=
            "🔵 STEAL";


        publishQuizState(
            "STEAL",
            "player1"
        );

    }


    startAnswerTimer();

    sendScreenState();

}


/* =========================================================
   SINGLE ANSWER FUNCTION
========================================================= */

function selectAnswer(
    index,
    button,
    player=null
){

    if(
        answered ||
        currentTeam===0
    )return;


    /*
        IMPORTANT:
        Kahit hindi pa revealed,
        automatic reveal.
    */

    if(
        !button.classList.contains(
            "revealed"
        )
    ){

        button.classList.add(
            "revealed"
        );

        revealedChoices++;


        publishQuizState(
            "BUZZ",

            currentTeam===1 ||
            currentTeam===4
            ?"player1"
            :"player2"
        );


        sendScreenState();

    }


    let answeringTeam=0;


    if(
        player==="player1"
    ){

        answeringTeam=1;

    }
    else if(
        player==="player2"
    ){

        answeringTeam=2;

    }
    else{

        answeringTeam=
            (
                currentTeam===1 ||
                currentTeam===4
            )
            ?1
            :2;

    }


    if(
        lockedTeam===
        answeringTeam
    )return;


    if(
        answeringTeam===1 &&
        currentTeam!==1 &&
        currentTeam!==4
    )return;


    if(
        answeringTeam===2 &&
        currentTeam!==2 &&
        currentTeam!==3
    )return;


    const q=
        questions[currentQuestion];


    const buttons=
        document.querySelectorAll(
            ".choice"
        );


    selectedAnswerIndex=
        index;


    /* =====================================================
       CORRECT
    ===================================================== */

    if(
        index===q.answer
    ){

        answered=true;

        answerResult="correct";


        stopTimers();

        stopTimerSound();

        hideTimer();


        button
            .classList
            .remove("revealed");


        button
            .classList
            .remove("wrong");


        button
            .classList
            .add("correct");


        buttons.forEach(
            b=>b.disabled=true
        );


        correctSound.currentTime=0;

        correctSound
            .play()
            .catch(()=>{});


        publishQuizState(
            "FINISHED",
            null
        );


        playCorrectBGM();


        if(
            answeringTeam===1
        ){

            scoreTeam1++;

            score1Element.innerText=
                scoreTeam1;

        }
        else{

            scoreTeam2++;

            score2Element.innerText=
                scoreTeam2;

        }


        sendScreenState();

        return;

    }


    /* =====================================================
       WRONG
    ===================================================== */

    answerResult="wrong";


    button.classList.add(
        "wrong"
    );


    button.disabled=true;


    wrongSound.currentTime=0;

    wrongSound
        .play()
        .catch(()=>{});


    stopTimers();

    stopTimerSound();

    hideTimer();


    answerAttempts++;


    lockedTeam=
        answeringTeam;


    /*
        SECOND WRONG:
        SHOW CORRECT ANSWER
    */

    if(
        answerAttempts>=2
    ){

        revealCorrectAnswer();

        return;

    }


    /*
        FIRST WRONG:
        STEAL
    */

    prepareNextAttempt();

}


/* =========================================================
   KEYBOARD ANSWERS
   Z = A
   X = B
   C = C
   V = D
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName==="INPUT" ||
            e.target.tagName==="TEXTAREA"
        )return;


        if(
            answered ||
            currentTeam===0
        )return;


        const map={

            z:0,
            x:1,
            c:2,
            v:3

        };


        const key=
            e.key.toLowerCase();


        if(
            !(key in map)
        )return;


        const index=
            map[key];


        const b=
            document
            .querySelectorAll(
                ".choice"
            )[index];


        if(!b)return;


        if(b.disabled)return;


        e.preventDefault();


        /*
            AUTO REVEAL
        */

        if(
            !b.classList.contains(
                "revealed"
            )
        ){

            b.classList.add(
                "revealed"
            );

            revealedChoices++;


            publishQuizState(
                "BUZZ",
                currentTeam===1 ||
                currentTeam===4
                ?"player1"
                :"player2"
            );


            sendScreenState();

        }


        selectAnswer(
            index,
            b
        );

    }
);


/* =========================================================
   SPACE = NEXT
========================================================= */

document.addEventListener(
    "keydown",
    async e=>{

        if(
            e.code!=="Space"
        )return;


        e.preventDefault();


        if(
            !answered ||
            bgm1Fading
        )return;


        autoNextAfterBgm1=false;


        stopTimers();

        stopTimerSound();

        hideTimer();


        if(currentBgm1){

            await new Promise(
                r=>fadeOutBgm1(r)
            );

        }
        else{

            bgm1Variants.forEach(
                resetBgm1
            );

        }


        await playAudio(bgm2);


        nextQuestion();

    }
);


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    stopTimers();

    stopTimerSound();

    hideTimer();


    if(
        currentQuestion>=
        questions.length
    )return;


    currentQuestion++;


    if(
        currentQuestion>=
        questions.length
    ){

        finishQuiz();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH
========================================================= */

function finishQuiz(){

    stopAudio(bgm);

    stopAudio(bgm2);


    bgm1Variants.forEach(
        resetBgm1
    );


    currentBgm1=null;

    autoNextAfterBgm1=false;

    clearBgm1Fade();


    stopTimers();

    stopTimerSound();

    hideTimer();


    questionElement.innerText="";

    choicesElement.innerHTML="";

    progressElement.innerText="";

    messageElement.innerText=
        "QUIZ FINISHED";


    team1Box.style.display=
        "none";


    team2Box.style.display=
        "none";


    connectBtn.style.display=
        "none";


    if(
        firebaseConnected &&
        roomRef
    ){

        roomRef
        .child("state")
        .set({

            phase:
                "QUIZ_FINISHED",

            round:
                currentQuestion+1,

            scoreTeam1,

            scoreTeam2,

            at:
                firebase.database
                .ServerValue
                .TIMESTAMP

        });

    }


    sendScreenState();

}
/* =========================================================
   UPLOAD QUESTIONS JSON
========================================================= */

let questions=[];

const questionsFile=
    document.getElementById("questionsFile");


questionsFile.addEventListener(
    "change",
    async function(e){

        const file=e.target.files[0];

        if(!file)return;

        if(!file.name.toLowerCase().endsWith(".json")){

            alert("Please upload a JSON questions file.");

            questionsFile.value="";

            return;

        }

        try{

            const text=
                await file.text();

            const data=
                JSON.parse(text);


            /*
                SUPPORT:

                [
                    {
                        question:"...",
                        choices:["A","B","C","D"],
                        answer:0
                    }
                ]

                OR

                {
                    questions:[
                        ...
                    ]
                }
            */

            let loadedQuestions=[];


            if(Array.isArray(data)){

                loadedQuestions=data;

            }
            else if(
                data &&
                Array.isArray(data.questions)
            ){

                loadedQuestions=data.questions;

            }
            else{

                throw new Error(
                    "Invalid JSON format."
                );

            }


            /*
                VALIDATE QUESTIONS
            */

            loadedQuestions=
                loadedQuestions.filter(q=>{

                    return(
                        q &&
                        typeof q.question==="string" &&
                        Array.isArray(q.choices) &&
                        q.choices.length>=4 &&
                        (
                            typeof q.answer==="number" ||
                            typeof q.correct==="number" ||
                            typeof q.correct==="string"
                        )
                    );

                });


            if(!loadedQuestions.length){

                throw new Error(
                    "No valid questions found."
                );

            }


            /*
                CONVERT FORMAT
            */

            questions=
                loadedQuestions.map(q=>{

                    let answer;


                    if(
                        typeof q.answer==="number"
                    ){

                        answer=q.answer;

                    }
                    else if(
                        typeof q.correct==="number"
                    ){

                        answer=q.correct;

                    }
                    else{

                        const letter=
                            String(q.correct)
                            .trim()
                            .toUpperCase();


                        answer={
                            A:0,
                            B:1,
                            C:2,
                            D:3
                        }[letter];

                    }


                    return{

                        question:
                            q.question,

                        choices:
                            q.choices.slice(0,4),

                        answer

                    };

                });


            /*
                VALIDATE ANSWERS
            */

            questions=
                questions.filter(q=>{

                    return(
                        q.answer>=0 &&
                        q.answer<4 &&
                        Number.isInteger(q.answer)
                    );

                });


            if(!questions.length){

                throw new Error(
                    "No valid answers found."
                );

            }


            /*
                RANDOMIZE
            */

            for(
                let i=questions.length-1;
                i>0;
                i--
            ){

                const j=
                    Math.floor(
                        Math.random()*(i+1)
                    );


                [
                    questions[i],
                    questions[j]
                ]=[
                    questions[j],
                    questions[i]
                ];

            }


            /*
                RESET QUIZ
            */

            currentQuestion=0;

            scoreTeam1=0;

            scoreTeam2=0;

            score1Element.innerText="0";

            score2Element.innerText="0";


            /*
                LOAD FIRST QUESTION
            */

            loadQuestion();


            alert(
                `✅ ${questions.length} questions loaded successfully!`
            );


        }catch(error){

            console.error(
                "Question JSON error:",
                error
            );


            alert(
                "❌ Failed to load questions.\n\n"+
                error.message
            );


            questions=[];

            questionsFile.value="";

        }

    }
);

/* =========================================================
   START
========================================================= */

questions=[];

questionElement.innerText=

progressElement.innerText=
    "No questions loaded";

choicesElement.innerHTML="";

messageElement.innerText=
    "📂 Click UPLOAD QUESTIONS";
</script>
