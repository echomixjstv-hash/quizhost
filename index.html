<style>

*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,sans-serif;
    background:#101010;
    color:#fff;
}

.game{
    width:100%;
    height:100vh;
    padding:12px;
    display:flex;
    flex-direction:column;
}

.top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.title{
    font-size:25px;
    font-weight:bold;
}

.status{
    padding:7px 14px;
    border-radius:20px;
    background:#555;
    font-size:13px;
}

.status.connected{
    background:#159447;
}

.scores{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
}

.team{
    flex:1;
    max-width:50%;
    text-align:center;
    padding:15px;
    border-radius:16px;
    background:#202020;
    border:4px solid;
    min-height:120px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    transition:all .4s ease,opacity .3s ease;
}

.team1{
    border-color:#3498db;
    color:#3498db;
}

.team2{
    border-color:#e74c3c;
    color:#e74c3c;
}

.team.buzzer-winner{
    flex:0 0 70%;
    max-width:70%;
    min-height:170px;
    animation:winnerGlow .7s infinite;
}

.team.hidden-team{
    flex:0 0 0%;
    max-width:0;
    width:0;
    padding:0;
    margin:0;
    opacity:0;
    transform:scale(0);
    overflow:hidden;
    border-width:0;
}

@keyframes winnerGlow{

    0%,100%{
        box-shadow:0 0 5px transparent;
    }

    50%{
        box-shadow:
        0 0 15px currentColor,
        0 0 35px currentColor,
        0 0 60px currentColor;
        border-color:#fff;
    }

}

.team-name{
    font-size:30px;
    font-weight:bold;
}

.team-score{
    font-size:65px;
    font-weight:bold;
    line-height:1;
    margin:5px 0;
}

.buzz{
    min-height:25px;
    font-size:18px;
    font-weight:bold;
}

.question-box{
    flex:1;
    width:100%;
    max-width:950px;
    margin:auto;
    background:#fff;
    color:#111;
    border-radius:15px;
    padding:20px;
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:0;
}

.progress{
    color:#666;
    font-size:15px;
    margin-bottom:12px;
}

.question{
    font-size:28px;
    font-weight:bold;
    margin-bottom:22px;
}

.choices{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.choice{
    width:100%;
    padding:16px;
    border:0;
    border-radius:10px;
    background:#e5e5e5;
    font-size:18px;
    cursor:pointer;
    text-align:left;
    transition:.2s;
}

.choice:hover:not(:disabled){
    background:#d5d5d5;
    transform:scale(1.01);
}

.choice.revealed{
    background:#9edcff!important;
}

.choice.correct{
    background:#20a35a!important;
    color:#fff!important;
}

.choice.wrong{
    background:#e74c3c!important;
    color:#fff!important;
}

.choice:disabled{
    cursor:not-allowed;
}

.message{
    min-height:30px;
    margin-top:15px;
    font-size:19px;
    font-weight:bold;
}

.bottom{
    height:55px;
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
}

.control-btn{
    border:0;
    border-radius:8px;
    padding:9px 18px;
    font-size:14px;
    cursor:pointer;
}

.connect{
    background:#3498db;
    color:#fff;
}

.second-screen{
    background:#8e44ad;
    color:#fff;
}

#timer{
    display:none;
    margin:8px auto;
    padding:8px 18px;
    width:max-content;
    min-width:90px;
    border:3px solid #f1c40f;
    border-radius:12px;
    font-size:30px;
    font-weight:bold;
    background:#151515;
    color:#f1c40f;
}

@media(max-width:600px){

    .title{

    .bottom{

/* =========================================================

========================================================= */

const bgm = new Audio("audio/bgm.mp3");

const bgm1Variants = [

    new Audio("audio/bgm1-1.mp3"),
    new Audio("audio/bgm1-2.mp3"),
    new Audio("audio/bgm1-3.mp3"),
    new Audio("audio/bgm1-4.mp3"),
    new Audio("audio/bgm1-5.mp3"),
    new Audio("audio/bgm1-6.mp3"),
    new Audio("audio/bgm1-7.mp3"),
    new Audio("audio/bgm1-8.mp3")

];

const bgm2 = new Audio("audio/bgm2.mp3");

const correctSound =
    new Audio("audio/Fact.mp3");

const wrongSound =
    new Audio("audio/mali.mp3");

const timerSound =
    new Audio("audio/timer.mp3");


bgm.loop = true;
bgm.volume = .5;

bgm2.loop = true;
bgm2.volume = 0;

timerSound.volume = .5;


bgm1Variants.forEach(a => {

    a.loop = false;
    a.volume = .5;

});


let musicStarted = false;

let currentBgm1 = null;

let bgm1FadeInterval = null;

let bgm2FadeInterval = null;


/* =========================================================
   AUDIO FUNCTIONS
========================================================= */

async function playAudio(a){

    try{

        await a.play();

        return true;

    }catch(e){

        console.log(
            "Audio blocked:",
            e
        );

        return false;

    }

}


function stopAudio(a){

    if(!a)return;

    a.pause();

    a.currentTime = 0;

}


async function startInitialBGM(){

    if(musicStarted)return;

    musicStarted = true;

    bgm.volume = .5;

    await playAudio(bgm);

}


document.addEventListener(
    "click",
    startInitialBGM,
    {once:true}
);


/* =========================================================
   FADE BGM1
========================================================= */

function clearBgm1Fade(){

    if(bgm1FadeInterval){

        clearInterval(
            bgm1FadeInterval
        );

        bgm1FadeInterval = null;

    }

}


function fadeOutBgm1(callback){

    const a = currentBgm1;

    if(!a){

        if(callback)callback();

        return;

    }


    clearBgm1Fade();


    const startVolume =
        Math.max(
            0,
            a.volume
        );


    const duration = 1200;

    const startTime = Date.now();


    bgm1FadeInterval =
        setInterval(()=>{

            const elapsed =
                Date.now() -
                startTime;


            const progress =
                Math.min(
                    1,
                    elapsed / duration
                );


            a.volume =
                startVolume *
                (1-progress);


            if(progress >= 1){

                clearInterval(
                    bgm1FadeInterval
                );

                bgm1FadeInterval = null;


                a.pause();

                a.currentTime = 0;

                a.volume = .5;

                a.onended = null;


                if(currentBgm1 === a){

                    currentBgm1 = null;

                }


                if(callback){

                    callback();

                }

            }

        },30);

}


/* =========================================================
   FADE IN BGM2
========================================================= */

function fadeInBgm2(){

    if(bgm2FadeInterval){

        clearInterval(
            bgm2FadeInterval
        );

    }


    bgm2.volume = 0;

    playAudio(bgm2);


    const duration = 1200;

    const startTime = Date.now();


    bgm2FadeInterval =
        setInterval(()=>{

            const progress =
                Math.min(
                    1,
                    (
                        Date.now() -
                        startTime
                    ) / duration
                );


            bgm2.volume =
                .5 * progress;


            if(progress >= 1){

                clearInterval(
                    bgm2FadeInterval
                );

                bgm2FadeInterval = null;

            }

        },30);

}


/* =========================================================
   RESET BGM1
========================================================= */

function resetBgm1(a){

    a.onended = null;

    a.pause();

    a.currentTime = 0;

    a.volume = .5;

}


/* =========================================================
   START QUIZ BGM
========================================================= */

async function startQuizBGM(){

    stopAudio(bgm);


    if(currentBgm1){

        await new Promise(
            resolve =>
                fadeOutBgm1(resolve)
        );

    }


    bgm1Variants.forEach(
        resetBgm1
    );


    fadeInBgm2();

}


/* =========================================================
   PLAY CORRECT BGM
========================================================= */

async function playCorrectBGM(){

    stopAudio(bgm);

    stopAudio(bgm2);

    bgm2.volume = 0;


    if(bgm2FadeInterval){

        clearInterval(
            bgm2FadeInterval
        );

        bgm2FadeInterval = null;

    }


    if(currentBgm1){

        await new Promise(
            resolve =>
                fadeOutBgm1(resolve)
        );

    }


    bgm1Variants.forEach(
        resetBgm1
    );


    const a =
        bgm1Variants[
            Math.floor(
                Math.random() *
                bgm1Variants.length
            )
        ];


    currentBgm1 = a;

    a.volume = 0;


    a.onended = ()=>{

        if(currentBgm1 !== a)return;

        a.currentTime = 0;

        a.play().catch(()=>{});

    };


    await playAudio(a);


    /*
        FADE IN BGM1
    */

    const duration = 1000;

    const startTime = Date.now();


    const fade =
        setInterval(()=>{

            if(currentBgm1 !== a){

                clearInterval(fade);

                return;

            }


            const progress =
                Math.min(
                    1,
                    (
                        Date.now() -
                        startTime
                    ) / duration
                );


            a.volume =
                .5 * progress;


            if(progress >= 1){

                clearInterval(fade);

            }

        },30);

}

function createRandomQuiz(){

    questions = [...questionBank];


    for(
        let i = questions.length - 1;
        i > 0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            questions[i],
            questions[j]
        ] =
        [
            questions[j],
            questions[i]
        ];

    }

}

========================================================= */

function publishQuizState(
    phase,
    allowedPlayer
){

    if(
        !firebaseConnected ||
        !roomRef
    )return;


    roomRef
    .child("state")
    .set({

        phase,

        round:
            currentQuestion + 1,

        attempt:
            Math.max(
                1,
                answerAttempts
            ),

        allowedPlayer:
            allowedPlayer || null,

        player:
            (
                currentTeam === 1 ||
                currentTeam === 4
            )
            ?
            "player1"
            :
            (
                currentTeam === 2 ||
                currentTeam === 3
            )
            ?
            "player2"
            :
            null,

        correct:
            answerResult === "correct",

        revealedChoices,

        timerSeconds,

        timerMode,

        at:
            firebase.database
            .ServerValue
            .TIMESTAMP

    })
    .catch(console.error);

}


function publishRoundStart(){

    if(
        !firebaseConnected ||
        !roomRef
    )return;


    roomRef.update({

        round:
            currentQuestion + 1,

        buzzer:null,

        answer:null,

        state:{

            phase:"WAITING",

            round:
                currentQuestion + 1,

            attempt:1,

            allowedPlayer:null,

            at:
                firebase.database
                .ServerValue
                .TIMESTAMP

        }

    })
    .catch(console.error);

}


/* =========================================================
   AUTOMATIC ENTER
========================================================= */

function stopAutoEnter(){

    if(autoEnterTimer){

        clearTimeout(
            autoEnterTimer
        );

        autoEnterTimer = null;

    }

}


function startAutoEnter(){

    stopAutoEnter();

    autoEnterCount = 0;


    if(!autoQuizEnabled)return;

    if(answered)return;

    if(currentTeam !== 0)return;


    autoEnterTimer =
        setTimeout(
            automaticEnter,
            AUTO_FIRST_DELAY
        );

}


function automaticEnter(){

    autoEnterTimer = null;


    if(!autoQuizEnabled)return;

    if(answered)return;


    if(currentTeam !== 0){

        stopAutoEnter();

        return;

    }


    if(
        autoEnterCount >=
        AUTO_MAX_PRESSES
    ){

        stopAutoEnter();

        return;

    }


    autoEnterCount++;


    console.log(
        "AUTOMATIC ENTER:",
        autoEnterCount
    );


    revealNextChoice();


    if(
        autoEnterCount >=
        AUTO_MAX_PRESSES
    ){

        stopAutoEnter();

        return;

    }


    if(
        !answered &&
        currentTeam === 0
    ){

        autoEnterTimer =
            setTimeout(
                automaticEnter,
                AUTO_ENTER_INTERVAL
            );

    }

}


/* =========================================================
   AUTOMATIC NEXT
========================================================= */

function stopAutoNext(){

    if(autoNextTimer){

        clearTimeout(
            autoNextTimer
        );

        autoNextTimer = null;

    }

}


function automaticNextQuestion(
    delay = 8000
){

    stopAutoNext();

    stopAutoEnter();


    autoNextTimer =
        setTimeout(()=>{

            autoNextTimer = null;


            if(answered){

                nextQuestion();

            }

        },delay);

}

connectBtn.onclick = async ()=>{

    await startInitialBGM();


    const value =
        document
        .getElementById(
            "roomInput"
        )
        .value
        .trim();


    if(!value){

        alert(
            "Enter a room number first."
        );

        return;

    }


    roomNumber = value;


    roomRef =
        db.ref(
            "rooms/" +
            roomNumber
        );


    try{

        const snap =
            await roomRef
            .child("round")
            .once("value");


        if(
            snap.val() === null
        ){

            await roomRef
            .child("round")
            .set(1);

        }


        firebaseConnected = true;


        connectionStatus.innerText =
            "Firebase: Connected • Room " +
            roomNumber;


        connectionStatus
            .classList
            .add("connected");


        connectBtn.innerText =
            "✓ ROOM " +
            roomNumber +
            " CONNECTED";


        listenFirebase();

        listenRemoteButtons();


        roomRef
        .child("remoteButton")
        .once("value")
        .then(s => {

            const d = s.val();


            if(
                d &&
                d.timestamp
            ){

                lastRemoteTimestamp =
                    Number(
                        d.timestamp
                    );

            }

        });


        publishQuizState(
            "WAITING",
            null
        );


    }catch(e){

        console.error(e);


        alert(
            "Firebase connection error. Check Realtime Database Rules."
        );

    }

};


/* =========================================================
   FIREBASE LISTENERS
========================================================= */

function listenFirebase(){

    roomRef
    .child("buzzer")
    .on("value",snap=>{

        const d = snap.val();


        if(
            !d ||
            Number(d.round) !==
            currentQuestion + 1 ||
            answered
        )return;


        teamBuzz(
            d.player === "player1"
            ? 1
            : 2
        );

    });


    roomRef
    .child("answer")
    .on("value",snap=>{

        const d = snap.val();


        if(
            !d ||
            Number(d.round) !==
            currentQuestion + 1 ||
            answered
        )return;


        const idx = {

            A:0,
            B:1,
            C:2,
            D:3

        }[
            String(
                d.answer || ""
            ).toUpperCase()
        ];


        if(idx === undefined)return;


        const buttons =
            document.querySelectorAll(
                ".choice"
            );


        const button =
            buttons[idx];


        if(!button)return;


        const p =
            String(
                d.player || ""
            ).toLowerCase();


        if(
            p !== "player1" &&
            p !== "player2"
        )return;


        if(
            !button.classList.contains(
                "revealed"
            )
        ){

            button.classList.add(
                "revealed"
            );

            revealedChoices++;

        }


        if(button.disabled)return;


        selectAnswer(
            idx,
            button,
            p
        );

    });

}


/* =========================================================
   REMOTE BUTTON
========================================================= */

function listenRemoteButtons(){

    if(
        !roomRef ||
        remoteListenerStarted
    )return;


    remoteListenerStarted = true;


    roomRef
    .child("remoteButton")
    .on("value",snap=>{

        const d = snap.val();

        if(!d)return;


        const timestamp =
            Number(
                d.timestamp || 0
            );


        if(
            timestamp <=
            lastRemoteTimestamp
        )return;


        lastRemoteTimestamp =
            timestamp;


        if(
            d.round &&
            Number(d.round) !==
            currentQuestion + 1
        )return;


        const command =
            String(
                d.command || ""
            ).toUpperCase();


        if(command === "TEAM1"){

            if(
                lockedTeam === 1 ||
                currentTeam === 3 ||
                currentTeam !== 0
            )return;


            teamBuzz(1);

            return;

        }


        if(command === "TEAM2"){

            if(
                lockedTeam === 2 ||
                currentTeam === 4 ||
                currentTeam !== 0
            )return;


            teamBuzz(2);

            return;

        }


        const idx = {

            A:0,
            B:1,
            C:2,
            D:3

        }[command];


        if(idx === undefined)return;


        const player =
            String(
                d.player || ""
            ).toLowerCase();


        if(
            player !== "player1" &&
            player !== "player2"
        )return;


        if(
            player === "player1" &&
            (
                lockedTeam === 1 ||
                (
                    currentTeam !== 1 &&
                    currentTeam !== 4
                )
            )
        )return;


        if(
            player === "player2" &&
            (
                lockedTeam === 2 ||
                (
                    currentTeam !== 2 &&
                    currentTeam !== 3
                )
            )
        )return;


        const buttons =
            document.querySelectorAll(
                ".choice"
            );


        const button =
            buttons[idx];


        if(!button)return;


        if(
            !button.classList.contains(
                "revealed"
            )
        ){

            button.classList.add(
                "revealed"
            );

            revealedChoices++;

        }


        if(button.disabled)return;


        selectAnswer(
            idx,
            button,
            player
        );

    });

}


/* =========================================================
   REVEAL CHOICES
========================================================= */

function revealNextChoice(){

    if(answered)return;


    if(revealedChoices < 4){

        revealedChoices++;


        const buttons =
            document.querySelectorAll(
                ".choice"
            );


        const b =
            buttons[
                revealedChoices - 1
            ];


        if(b){

            b.classList.add(
                "revealed"
            );

        }


        publishQuizState(
            "WAITING",
            null
        );


        sendScreenState();


        return;

    }


    if(
        revealedChoices >= 4 &&
        currentTeam === 0
    ){

        stopAutoEnter();


        startBuzzTimer();


        publishQuizState(
            "READY",
            null
        );


        sendScreenState();

    }

}


/* =========================================================
   BUZZER
========================================================= */

function teamBuzz(team){

    if(
        answered ||
        revealedChoices < 1
    )return;


    if(currentTeam === 0){

        currentTeam = team;

        stopAutoEnter();

        stopBuzzTimer();


        publishQuizState(
            "BUZZ",
            team === 1
            ? "player1"
            : "player2"
        );


        if(team === 1){

            team1Box
            .classList
            .add(
                "buzzer-winner"
            );


            team2Box
            .classList
            .add(
                "hidden-team"
            );


            buzz1.innerText =
                "🔵 TEAM 1 BUZZED!";


            buzz2.innerText = "";


        }else{

            team2Box
            .classList
            .add(
                "buzzer-winner"
            );


            team1Box
            .classList
            .add(
                "hidden-team"
            );


            buzz2.innerText =
                "🔴 TEAM 2 BUZZED!";


            buzz1.innerText = "";

        }


        startAnswerAfterBuzz();

        sendScreenState();

        return;

    }


    if(
        currentTeam === 3 &&
        team === 2
    ){

        currentTeam = 2;

        stopAutoEnter();


        team1Box
        .classList
        .add(
            "hidden-team"
        );


        team2Box
        .classList
        .remove(
            "hidden-team"
        );


        team2Box
        .classList
        .add(
            "buzzer-winner"
        );


        buzz2.innerText =
            "🔴 TEAM 2 STEAL!";


        publishQuizState(
            "STEAL",
            "player2"
        );


        startAnswerAfterBuzz();

        sendScreenState();

        return;

    }


    if(
        currentTeam === 4 &&
        team === 1
    ){

        currentTeam = 1;

        stopAutoEnter();


        team2Box
        .classList
        .add(
            "hidden-team"
        );


        team1Box
        .classList
        .remove(
            "hidden-team"
        );


        team1Box
        .classList
        .add(
            "buzzer-winner"
        );


        buzz1.innerText =
            "🔵 TEAM 1 STEAL!";


        publishQuizState(
            "STEAL",
            "player1"
        );


        startAnswerAfterBuzz();

        sendScreenState();

    }

}


/* =========================================================
   START ANSWER
========================================================= */

function startAnswerAfterBuzz(){

    stopTimers();

    stopAutoEnter();


    document
    .querySelectorAll(
        ".choice"
    )
    .forEach(b=>{

        if(
            !b.classList.contains(
                "wrong"
            )
        ){

            b.disabled = false;

        }

    });


    publishQuizState(

        currentTeam === 3 ||
        currentTeam === 4
        ? "STEAL"
        : "BUZZ",

        currentTeam === 1 ||
        currentTeam === 4
        ? "player1"
        : "player2"

    );


    startAnswerTimer();

    sendScreenState();

}


/* =========================================================
   LOAD QUESTION
========================================================= */

function loadQuestion(){

    stopAutoEnter();

    stopAutoNext();

    stopTimers();

    stopTimerSound();

    hideTimer();


    if(
        currentQuestion >=
        questions.length
    ){

        finishQuiz();

        return;

    }


    currentTeam = 0;

    answered = false;

    answerAttempts = 0;

    revealedChoices = 0;

    lockedTeam = 0;

    selectedAnswerIndex = -1;

    answerResult = "";


    team1Box
    .classList
    .remove(
        "buzzer-winner",
        "hidden-team"
    );


    team2Box
    .classList
    .remove(
        "buzzer-winner",
        "hidden-team"
    );


    buzz1.innerText = "Ready";

    buzz2.innerText = "Ready";


    progressElement.innerText =
        `Question ${
            currentQuestion + 1
        } / ${
            questions.length
        }`;


    const q =
        questions[currentQuestion];


    questionElement.innerText =
        q.question;


    choicesElement.innerHTML = "";


    ["A","B","C","D"]
    .forEach(
        (letter,index)=>{

            const b =
                document.createElement(
                    "button"
                );


            b.className =
                "choice";


            b.innerText =
                letter +
                ". " +
                q.choices[index];


            b.disabled = false;


            b.onclick = ()=>{

                if(
                    !b.classList.contains(
                        "revealed"
                    )
                ){

                    b.classList.add(
                        "revealed"
                    );

                    revealedChoices++;


                    publishQuizState(
                        currentTeam === 0
                        ? "WAITING"
                        : "BUZZ",

                        currentTeam === 1 ||
                        currentTeam === 4
                        ? "player1"
                        :
                        currentTeam === 2 ||
                        currentTeam === 3
                        ? "player2"
                        :
                        null
                    );


                    sendScreenState();

                }


                if(currentTeam === 0){

                    return;

                }


                selectAnswer(
                    index,
                    b
                );

            };


            choicesElement.appendChild(b);

        }
    );


    messageElement.innerText = "";


    publishQuizState(
        "WAITING",
        null
    );


    sendScreenState();


    /*
        8 SECONDS
        BEFORE FIRST ENTER
    */

    startAutoEnter();

}


/* =========================================================
   TIMERS
========================================================= */

function stopTimers(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer = null;

    }


    if(answerTimer){

        clearInterval(
            answerTimer
        );

        answerTimer = null;

    }

}


function stopBuzzTimer(){

    if(buzzTimer){

        clearInterval(
            buzzTimer
        );

        buzzTimer = null;

    }

}


function stopTimerSound(){

    timerSound.pause();

    timerSound.currentTime = 0;

    timerSound.onended = null;

}


function showTimer(
    seconds,
    mode
){

    timerMode = mode;

    timerSeconds = seconds;


    timerElement.style.display =
        "block";


    timerElement.innerText =
        seconds;


    timerElement.style.borderColor =
        mode === "buzz"
        ? "#f1c40f"
        : "#e67e22";


    timerElement.style.color =
        mode === "buzz"
        ? "#f1c40f"
        : "#e67e22";


    publishQuizState(

        mode === "buzz"
        ? "READY"
        : "BUZZ",

        currentTeam === 1 ||
        currentTeam === 4
        ? "player1"
        :
        currentTeam === 2 ||
        currentTeam === 3
        ? "player2"
        :
        null

    );

}


function hideTimer(){

    timerElement.style.display =
        "none";

    timerSeconds = 0;

    timerMode = "";

}


/* =========================================================
   BUZZ TIMER
========================================================= */

function startBuzzTimer(){

    stopTimers();

    stopAutoEnter();


    showTimer(
        10,
        "buzz"
    );


    publishQuizState(
        "READY",
        null
    );


    buzzTimer =
        setInterval(()=>{

            timerSeconds--;

            timerElement.innerText =
                timerSeconds;


            sendScreenState();


            if(
                timerSeconds <= 0
            ){

                stopBuzzTimer();

                hideTimer();


                publishQuizState(
                    "WAITING",
                    null
                );


                sendScreenState();


                setTimeout(()=>{

                    if(!answered){

                        nextQuestion();

                    }

                },500);

            }

        },1000);

}


/* =========================================================
   ANSWER TIMER
========================================================= */

function startAnswerTimer(){

    stopTimers();


    showTimer(
        10,
        "answer"
    );


    timerSound.currentTime = 0;

    timerSound
    .play()
    .catch(()=>{});


    answerTimer =
        setInterval(()=>{

            timerSeconds--;

            timerElement.innerText =
                timerSeconds;


            sendScreenState();


            if(
                timerSeconds <= 0
            ){

                clearInterval(
                    answerTimer
                );

                answerTimer = null;


                handleAnswerTimeout();

            }

        },1000);

}


/* =========================================================
   ANSWER TIMEOUT
========================================================= */

function handleAnswerTimeout(){

    if(answered)return;


    stopTimers();

    stopTimerSound();

    hideTimer();


    document
    .querySelectorAll(
        ".choice"
    )
    .forEach(
        b=>b.disabled=true
    );


    answerAttempts++;


    wrongSound.currentTime = 0;

    wrongSound
    .play()
    .catch(()=>{});


    if(answerAttempts >= 2){

        revealCorrectAnswer();

        return;

    }


    prepareNextAttempt();

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

function revealCorrectAnswer(){

    const q =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".choice"
        );


    buttons.forEach(
        (b,i)=>{

            b.disabled = true;


            if(i === q.answer){

                b.classList.add(
                    "correct"
                );

            }

        }
    );


    selectedAnswerIndex =
        q.answer;


    answerResult = "correct";

    answered = true;


    stopAutoEnter();

    stopTimers();

    stopTimerSound();

    hideTimer();


    publishQuizState(
        "FINISHED",
        null
    );


    sendScreenState();


    /*
        WAIT 8 SECONDS
        THEN NEXT
    */

    automaticNextQuestion(
        3000
    );

}


/* =========================================================
   STEAL
========================================================= */

function prepareNextAttempt(){

    if(answerAttempts >= 2){

        revealCorrectAnswer();

        return;

    }


    if(
        currentTeam === 1 ||
        currentTeam === 4
    ){

        lockedTeam = 1;

        currentTeam = 3;


        team1Box
        .classList
        .add(
            "hidden-team"
        );


        team2Box
        .classList
        .remove(
            "hidden-team"
        );


        team2Box
        .classList
        .add(
            "buzzer-winner"
        );


        buzz1.innerText =
            "❌ WRONG";


        buzz2.innerText =
            "🔴 STEAL";


        publishQuizState(
            "STEAL",
            "player2"
        );


    }else{

        lockedTeam = 2;

        currentTeam = 4;


        team2Box
        .classList
        .add(
            "hidden-team"
        );


        team1Box
        .classList
        .remove(
            "hidden-team"
        );


        team1Box
        .classList
        .add(
            "buzzer-winner"
        );


        buzz2.innerText =
            "❌ WRONG";


        buzz1.innerText =
            "🔵 STEAL";


        publishQuizState(
            "STEAL",
            "player1"
        );

    }


    startAnswerTimer();

    sendScreenState();

}


/* =========================================================
   ANSWER
========================================================= */

function selectAnswer(
    index,
    button,
    player = null
){

    if(
        answered ||
        currentTeam === 0
    )return;


    if(
        !button.classList.contains(
            "revealed"
        )
    ){

        button.classList.add(
            "revealed"
        );

        revealedChoices++;


        publishQuizState(
            "BUZZ",

            currentTeam === 1 ||
            currentTeam === 4
            ? "player1"
            : "player2"
        );


        sendScreenState();

    }


    let answeringTeam = 0;


    if(player === "player1"){

        answeringTeam = 1;

    }
    else if(player === "player2"){

        answeringTeam = 2;

    }
    else{

        answeringTeam =
            (
                currentTeam === 1 ||
                currentTeam === 4
            )
            ? 1
            : 2;

    }


    if(
        lockedTeam ===
        answeringTeam
    )return;


    if(
        answeringTeam === 1 &&
        currentTeam !== 1 &&
        currentTeam !== 4
    )return;


    if(
        answeringTeam === 2 &&
        currentTeam !== 2 &&
        currentTeam !== 3
    )return;


    const q =
        questions[currentQuestion];


    const buttons =
        document.querySelectorAll(
            ".choice"
        );


    selectedAnswerIndex =
        index;


    /* =====================================================
       CORRECT
    ===================================================== */

    if(index === q.answer){

        answered = true;

        answerResult = "correct";


        stopAutoEnter();

        stopTimers();

        stopTimerSound();

        hideTimer();


        button
        .classList
        .remove(
            "revealed"
        );


        button
        .classList
        .remove(
            "wrong"
        );


        button
        .classList
        .add(
            "correct"
        );


        buttons.forEach(
            b=>b.disabled=true
        );


        correctSound.currentTime = 0;

        correctSound
        .play()
        .catch(()=>{});


        if(answeringTeam === 1){

            scoreTeam1++;

            score1Element.innerText =
                scoreTeam1;

        }else{

            scoreTeam2++;

            score2Element.innerText =
                scoreTeam2;

        }


        publishQuizState(
            "FINISHED",
            null
        );


        /*
            FADE OUT QUIZ BGM
            THEN PLAY RANDOM BGM1
        */

        playCorrectBGM();


        sendScreenState();


        /*
            WAIT 8 SECONDS
            THEN NEXT QUESTION
        */

        automaticNextQuestion(
            8000
        );


        return;

    }


    /* =====================================================
       WRONG
    ===================================================== */

    answerResult = "wrong";


    button.classList.add(
        "wrong"
    );


    button.disabled = true;


    wrongSound.currentTime = 0;

    wrongSound
    .play()
    .catch(()=>{});


    stopTimers();

    stopTimerSound();

    hideTimer();


    answerAttempts++;


    lockedTeam =
        answeringTeam;


    if(answerAttempts >= 2){

        revealCorrectAnswer();

        return;

    }


    prepareNextAttempt();

}


/* =========================================================
   KEYBOARD ANSWERS
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName === "INPUT" ||
            e.target.tagName === "TEXTAREA"
        )return;


        if(
            answered ||
            currentTeam === 0
        )return;


        const map = {

            z:0,
            x:1,
            c:2,
            v:3

        };


        const key =
            e.key.toLowerCase();


        if(!(key in map))return;


        const index =
            map[key];


        const b =
            document
            .querySelectorAll(
                ".choice"
            )[index];


        if(!b)return;

        if(b.disabled)return;


        e.preventDefault();


        if(
            !b.classList.contains(
                "revealed"
            )
        ){

            b.classList.add(
                "revealed"
            );

            revealedChoices++;


            publishQuizState(
                "BUZZ",

                currentTeam === 1 ||
                currentTeam === 4
                ? "player1"
                : "player2"
            );


            sendScreenState();

        }


        selectAnswer(
            index,
            b
        );

    }
);


/* =========================================================
   ENTER
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.target.tagName === "INPUT" ||
            e.target.tagName === "TEXTAREA"
        )return;


        if(e.key !== "Enter")return;


        e.preventDefault();


        stopAutoEnter();


        if(
            !answered &&
            currentTeam === 0
        ){

            revealNextChoice();


            /*
                Continue the sequence
                only while choices remain.
            */

            if(
                revealedChoices < 4 &&
                !answered
            ){

                if(
                    autoEnterCount <
                    AUTO_MAX_PRESSES
                ){

                    autoEnterTimer =
                        setTimeout(
                            automaticEnter,
                            AUTO_ENTER_INTERVAL
                        );

                }

            }

        }

    }
);


/* =========================================================
   SPACE = NEXT
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        if(
            e.code !== "Space"
        )return;


        e.preventDefault();


        if(!answered)return;


        stopAutoEnter();

    stopAutoNext();

    stopTimers();

    stopTimerSound();

    hideTimer();


    nextQuestion();

    }
);


/* =========================================================
   NEXT BUTTON
========================================================= */

document.getElementById(
    "nextQuestionBtn"
).onclick = ()=>{

    stopAutoEnter();

    stopAutoNext();

    stopTimers();

    stopTimerSound();

    hideTimer();


    nextQuestion();

};


/* =========================================================
   NEXT QUESTION
========================================================= */

async function nextQuestion(){

    stopAutoEnter();

    stopAutoNext();

    stopTimers();

    stopTimerSound();

    hideTimer();


    /*
        FADE OUT CURRENT BGM1
    */

    if(currentBgm1){

        await new Promise(
            resolve =>
                fadeOutBgm1(resolve)
        );

    }


    bgm1Variants.forEach(
        resetBgm1
    );


    currentBgm1 = null;


    /*
        Start quiz BGM
        with fade-in
    */

    startQuizBGM();


    currentQuestion++;


    if(
        currentQuestion >=
        questions.length
    ){

        finishQuiz();

        return;

    }


    loadQuestion();

}


/* =========================================================
   FINISH
========================================================= */

function finishQuiz(){

    stopAutoEnter();

    stopAutoNext();

    stopAudio(bgm);

    stopAudio(bgm2);


    bgm1Variants.forEach(
        resetBgm1
    );


    currentBgm1 = null;


    if(bgm1FadeInterval){

        clearInterval(
            bgm1FadeInterval
        );

        bgm1FadeInterval = null;

    }


    if(bgm2FadeInterval){

        clearInterval(
            bgm2FadeInterval
        );

        bgm2FadeInterval = null;

    }


    stopTimers();

    stopTimerSound();

    hideTimer();


    questionElement.innerText = "";

    choicesElement.innerHTML = "";

    progressElement.innerText = "";


    messageElement.innerText =
        "QUIZ FINISHED";


    team1Box.style.display =
        "none";


    team2Box.style.display =
        "none";


    connectBtn.style.display =
        "none";


    if(
        firebaseConnected &&
        roomRef
    ){

        roomRef
        .child("state")
        .set({

            phase:
                "QUIZ_FINISHED",

            round:
                currentQuestion + 1,

            scoreTeam1,

            scoreTeam2,

            at:
                firebase.database
                .ServerValue
                .TIMESTAMP

        });

    }


    sendScreenState();

}


/* =========================================================
   START
========================================================= */

createRandomQuiz();

loadQuestion();


/* =========================================================
   AUTO CONNECT TO ROOM 1
========================================================= */

window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            ()=>{

                /*
                    Make sure Room 1
                    is selected.
                */

                document
                .getElementById(
                    "roomInput"
                )
                .value = "1";


                /*
                    Automatically connect.
                */

                connectBtn.click();

            },
            700
        );

    }
);
